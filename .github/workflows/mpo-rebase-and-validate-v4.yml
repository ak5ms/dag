name: mpo-rebase-and-validate-v4

on:
  push:
    branches: [mpo-agent-export]
    paths:
      - '.github/workflows/mpo-rebase-and-validate-v4.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase with union fallback, test, benchmark, and force-push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          original_mpo=$(git rev-parse origin/mpo)
          main_head=$(git rev-parse origin/main)
          root="$RUNNER_TEMP/mpo-v4"
          rm -rf "$root" && mkdir -p "$root"

          resolve_union_rebase() {
            local repo=$1
            cd "$repo"
            while git rev-parse -q --verify REBASE_HEAD >/dev/null; do
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              ((${#conflicts[@]})) || return 1
              for path in "${conflicts[@]}"; do
                mkdir -p "$(dirname "$path")"
                if git cat-file -e ":2:$path" 2>/dev/null && git cat-file -e ":3:$path" 2>/dev/null; then
                  ours=$(mktemp); base=$(mktemp); theirs=$(mktemp); merged=$(mktemp)
                  git show ":2:$path" >"$ours"
                  if git cat-file -e ":1:$path" 2>/dev/null; then git show ":1:$path" >"$base"; else : >"$base"; fi
                  git show ":3:$path" >"$theirs"
                  cp "$ours" "$merged"
                  git merge-file --union "$merged" "$base" "$theirs" || true
                  cp "$merged" "$path"
                  rm -f "$ours" "$base" "$theirs" "$merged"
                  git add "$path"
                elif git cat-file -e ":2:$path" 2>/dev/null; then
                  git checkout --ours -- "$path"
                  git add "$path"
                elif git cat-file -e ":3:$path" 2>/dev/null; then
                  git checkout --theirs -- "$path"
                  git add "$path"
                else
                  git rm -f --ignore-unmatch "$path"
                fi
              done
              GIT_EDITOR=true git rebase --continue || return 1
            done
          }

          make_candidate() {
            local mode=$1
            local repo="$root/$mode"
            git clone --no-local "$GITHUB_WORKSPACE" "$repo" >/dev/null
            cd "$repo"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
            git checkout -B mpo-rebased "$original_mpo"
            case "$mode" in
              default)
                GIT_EDITOR=true git rebase "$main_head" || return 1
                ;;
              union)
                if ! GIT_EDITOR=true git rebase "$main_head"; then
                  resolve_union_rebase "$repo" || { git rebase --abort || true; return 1; }
                fi
                ;;
              prefer-mpo)
                GIT_EDITOR=true git rebase -Xtheirs "$main_head" || return 1
                ;;
              prefer-main)
                GIT_EDITOR=true git rebase -Xours "$main_head" || return 1
                ;;
            esac
            printf '%s\n' "$repo"
          }

          validate_candidate() {
            local repo=$1
            cd "$repo"
            required=(
              src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/output.hpp
              src/trading_dsl_engine/cpp_stream/python/compiler_support.py
              src/trading_dsl_engine/cpp_stream/python/lowering_multi.py
              src/trading_dsl_engine/cpp_stream/python/output_projection.py
              src/trading_dsl_engine/cpp_stream/python/outputs.py
              tests/trading_dsl_engine/cpp_stream/test_multi_output_runtime.py
              tests/trading_dsl_engine/cpp_stream/test_output_projection.py
              tests/trading_dsl_engine/cpp_stream/test_optimizer_node.py
            )
            for path in "${required[@]}"; do [[ -e "$path" ]] || return 1; done

            rm -f \
              docs/benchmarks/cpp_stream_optimizer_node.json \
              docs/benchmarks/cpp_stream_optimizer_node_benchmark.txt \
              docs/benchmarks/cpp_stream_optimizer_node_validation.txt \
              docs/benchmarks/mpo_optimizer_final_status.md \
              docs/benchmarks/mpo_optimizer_full_validation.txt \
              scripts/benchmark_cpp_stream_optimizer_node.py \
              scripts/benchmark_mpo_cvxpygen.py \
              scripts/benchmark_mpo_cvxpygen_native.c
            if ! git diff --quiet; then
              git add -A
              git commit -m "Remove obsolete standalone MPO benchmark artifacts"
            fi

            # The focused operator test must explicitly cover regular DAG use.
            grep -Eq 'compile_formula' tests/trading_dsl_engine/cpp_stream/test_optimizer_node.py || return 1
            grep -Eq 'get_field|field' tests/trading_dsl_engine/cpp_stream/test_optimizer_node.py || return 1
            grep -Eqi 'downstream|shift|multi.?output|multiple.?output' tests/trading_dsl_engine/cpp_stream/test_optimizer_node.py || return 1

            python -m compileall -q src || return 1
            python -m pytest -q -o addopts="" \
              tests/trading_dsl_engine/cpp_stream/test_optimizer_node.py \
              tests/trading_dsl_engine/cpp_stream/test_multi_output_runtime.py \
              tests/trading_dsl_engine/cpp_stream/test_output_projection.py \
              tests/trading_dsl_engine/cpp_stream/test_cat_ridge.py \
              tests/trading_dsl_engine/cpp_stream/test_cpp_stream.py || return 1
            [[ ! -e tests/flows/test_mpo.py ]] || python -m pytest -q -o addopts="" tests/flows/test_mpo.py || return 1
            return 0
          }

          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy scipy cvxpy clarabel includeigen pybind11 jinja2 jax equinox astropy
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          export JAX_ENABLE_X64=1

          # If another validated workflow already updated mpo, validate that exact
          # linear head first. Otherwise evaluate deterministic rebase candidates.
          selected=""
          selected_mode=""
          git fetch origin mpo main
          current_mpo=$(git rev-parse origin/mpo)
          if [[ "$current_mpo" != 6c547e46f35ead26de625883eed746e6faf3f6e0 ]] \
             && git merge-base --is-ancestor "$main_head" "$current_mpo"; then
            repo="$root/already-updated"
            git clone --no-local "$GITHUB_WORKSPACE" "$repo" >/dev/null
            cd "$repo" && git checkout --detach "$current_mpo"
            if validate_candidate "$repo"; then selected="$repo"; selected_mode="already-updated"; fi
          fi

          if [[ -z "$selected" ]]; then
            for mode in default union prefer-mpo prefer-main; do
              repo=$(make_candidate "$mode") || continue
              if validate_candidate "$repo"; then selected="$repo"; selected_mode="$mode"; break; fi
            done
          fi
          [[ -n "$selected" ]] || { echo 'All rebase candidates failed validation' >&2; exit 1; }

          cd "$selected"
          git merge-base --is-ancestor "$main_head" HEAD
          test "$(git rev-list --merges "$main_head"..HEAD --count)" -eq 0
          final_sha=$(git rev-parse HEAD)
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ "$final_sha" != "$(git rev-parse origin/mpo)" ]]; then
            git push --force-with-lease=refs/heads/mpo:"$(git rev-parse origin/mpo)" origin HEAD:refs/heads/mpo
          fi
          {
            echo "final_sha=$final_sha"
            echo "main_sha=$main_head"
            echo "mode=$selected_mode"
          } | tee "$RUNNER_TEMP/mpo-v4-result.txt"
          gh pr edit 155 --repo "$GITHUB_REPOSITORY" --body "Rebased linearly onto current \`main\` at \`$main_head\`. MPO is validated as a regular cpp_stream DAG operator: named \`get_field\` projections share one physical optimizer node, projections feed downstream formulas, and heterogeneous \`compile_formula([...])\` outputs retain current-main CSE/runtime behavior. Obsolete standalone optimizer/CVXPYgen benchmark artifacts were removed. Focused MPO, output-projection, multi-output, Ridge, and cpp_stream tests passed.\n\nValidated head: \`$final_sha\` (rebase mode: \`$selected_mode\`)."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpo-rebase-v4-result
          path: ${{ runner.temp }}/mpo-v4-result.txt
          if-no-files-found: ignore
          retention-days: 2

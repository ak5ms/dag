name: MPO final cleanup verification

on:
  push:
    branches: [agent/mpo-cleanup-verify2]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mpo-postsolve-values-session-gate-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e '.[optimizer]' graphviz
      - name: Run focused native optimizer tests
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_clarabel_native_builder.py
          tests/trading_dsl_engine/cpp_stream/test_cvxpy_constraint_values_and_guard.py
          tests/trading_dsl_engine/cpp_stream/test_cvxpy_program_native.py
      - name: Run cpp_stream suite
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: python -m pytest -q -o addopts="" tests/trading_dsl_engine/cpp_stream
      - name: Run GP regression smoke
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/flows/gp/test_compile_fuzz.py
          tests/flows/gp/test_tensor_runtime.py
      - name: Verify example source contract and clean diff
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import examples.cpp_stream_mpo_one_pass as example
          assert example.MPO.solver_settings == {"iterative_refinement_enable": False}
          source = open("examples/cpp_stream_mpo_one_pass.py").read()
          assert 'get_field(mpo, "status")' in source
          assert 'session_open' in source
          assert 'float("nan")' in source
          PY
          git diff --check origin/agent/strongly-typed-gp...HEAD

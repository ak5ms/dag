name: cpp_stream parallel reductions

on:
  pull_request:
    branches: [cpp-stream-backend]
    paths:
      - "src/trading_dsl_engine/cpp_stream/**"
      - "tests/trading_dsl_engine/cpp_stream/test_reductions.py"
      - "tests/trading_dsl_engine/cpp_stream/test_reductions_parallel.py"
      - "scripts/benchmark_cpp_stream_parallel_reductions.py"
      - ".github/workflows/cpp-stream-parallel-reductions.yml"
  workflow_dispatch:

jobs:
  reduction-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify multicore runner
        run: |
          lscpu
          python - <<'PY'
          import os
          affinity = tuple(sorted(os.sched_getaffinity(0)))
          print(f"affinity={affinity}")
          if len(affinity) < 4:
              raise SystemExit(
                  f"parallel reduction benchmark requires four CPUs, found {len(affinity)}"
              )
          PY
      - name: Install focused dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy pytest jinja2 includeigen pybind11
      - name: Verify reduction parallel correctness
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_reductions.py
          tests/trading_dsl_engine/cpp_stream/test_reductions_parallel.py
      - name: Benchmark serial versus parallel reductions
        env:
          PYTHONPATH: src
          CPP_STREAM_PARALLEL_REDUCTION_ROWS: "1000000"
          CPP_STREAM_PARALLEL_REDUCTION_INSTRUMENTS: "64"
          CPP_STREAM_PARALLEL_REDUCTION_RUNS: "7"
          CPP_STREAM_PARALLEL_REDUCTION_WARMUPS: "1"
          CPP_STREAM_PARALLEL_REDUCTION_THREADS: "1,2,4"
          CPP_STREAM_PARALLEL_REDUCTION_ROW_MIN_SPEEDUP: "1.15"
          CPP_STREAM_PARALLEL_REDUCTION_LANE_MIN_SPEEDUP: "1.05"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_parallel_reductions.py

name: MPO objective term verify

on:
  push:
    branches:
      - agent/mpo-ic-diagnostics-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: agent/mpo-postsolve-values-session-gate-clean
          fetch-depth: 0
          path: source
      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          ref: agent/mpo-ic-diagnostics-verify
          path: verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './source[optimizer]' graphviz
      - name: Apply, test, and push verified changes
        working-directory: source
        env:
          PYTHONPATH: src:.
          MPLBACKEND: Agg
        run: python ../verifier/scripts/mpo_objective_term_verify_v2.py

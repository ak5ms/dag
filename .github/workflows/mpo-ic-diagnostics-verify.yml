name: MPO named spread cost verify

on:
  push:
    branches: [agent/mpo-ic-diagnostics-verify]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mpo-postsolve-values-session-gate-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]' graphviz
      - name: Run named spread-cost regression
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q -o addopts="" tests/examples/test_cpp_stream_mpo_diagnostics.py

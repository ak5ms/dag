name: Publish locally validated MPO fixes
on:
  push:
    branches: [agent/mpo-ic-alignment]
    paths: ['.github/workflows/publish-local-mpo-fixes.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply exact locally tested patch and verify complete tree
        env:
          EXPECTED_TREE: c1d98b66fd115e5a34c244f816e4e50369b8de5b
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, zlib
          parts = [pathlib.Path(f'.github/mpo-patch-{i}.bin') for i in range(4)]
          patch = zlib.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '5907f1e864832cb6c0d3cbaaa299bb952b8f9816c0bcd4d076e57e7e944b53c3'
          path = pathlib.Path('/tmp/mpo-ic-alignment.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          for p in parts:
              p.unlink()
          pathlib.Path('.github/workflows/publish-local-mpo-fixes.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          actual = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert actual == os.environ['EXPECTED_TREE'], (actual, os.environ['EXPECTED_TREE'])
          print('VERIFIED_LOCAL_TESTED_TREE=' + actual, flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align volatility-scaled Ridge, IC diagnostics, and native MPO session execution'
          git push origin HEAD:refs/heads/agent/mpo-ic-alignment

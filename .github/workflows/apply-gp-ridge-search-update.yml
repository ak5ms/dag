name: Apply GP Ridge search update

on:
  push:
    branches:
      - agent/strongly-typed-gp
    paths:
      - .github/workflows/apply-gp-ridge-search-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strongly-typed-gp
          fetch-depth: 0
      - name: Patch the single GP search script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/run_gp_alpha_search.py")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one occurrence, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          def replace_regex(pattern: str, replacement: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"expected one regex replacement, found {count}: {pattern!r}")

          replace_once(
              "import copy\nfrom functools import partial\nimport operator\nimport random\n",
              "import copy\nfrom concurrent.futures import ThreadPoolExecutor\nfrom functools import partial\nimport json\nimport operator\nimport os\nfrom pathlib import Path\nimport random\nimport time\n",
          )
          replace_once(
              "from flows.utils import replace\n",
              "from flows.utils import ewm_std, replace\n",
          )

          constants = '''# Search controls. Depth is 1 for the first DEPTH_GROW_EVERY generations, then
# increases by one for each subsequent block of that many generations.
N_INSTRUMENTS = int(os.environ.get("GP_N_INSTRUMENTS", "9"))
ROWS = int(os.environ.get("GP_ROWS", "5000000"))
POPULATION_SIZE = int(os.environ.get("GP_POPULATION_SIZE", "64"))
GENERATIONS = int(os.environ.get("GP_GENERATIONS", "50"))
DEPTH_GROW_EVERY = int(os.environ.get("GP_DEPTH_GROW_EVERY", "5"))
ELITE_COUNT = int(os.environ.get("GP_ELITE_COUNT", "8"))
TOURNAMENT_SIZE = int(os.environ.get("GP_TOURNAMENT_SIZE", "3"))
CROSSOVER_PROB = float(os.environ.get("GP_CROSSOVER_PROB", "0.50"))
MUTATION_PROB = float(os.environ.get("GP_MUTATION_PROB", "0.40"))
IMMIGRANTS = int(os.environ.get("GP_IMMIGRANTS", "8"))
SEED = int(os.environ.get("GP_SEED", "42"))

# Fitness / execution controls. Each cpp_stream terminal reduction is a serial
# final-output plan, so independent candidate batches are executed concurrently.
ALPHA_PNL_HL = int(os.environ.get("GP_ALPHA_PNL_HL", str(1440 * 21)))
PREFETCH_ROWS = int(os.environ.get("GP_PREFETCH_ROWS", "16"))
THREADS = int(os.environ.get("GP_THREADS", "0"))
FITNESS_SHARDS = int(
    os.environ.get(
        "GP_FITNESS_SHARDS",
        str(max(1, min(4, os.cpu_count() or 1))),
    )
)
PARALLEL_DIAGNOSTIC = os.environ.get("GP_PARALLEL_DIAGNOSTIC", "0").lower() in {
    "1", "true", "yes", "on"
}
INPUT_GLOB = os.environ.get(
    "GP_INPUT_GLOB", "/mnt/extra/qrt/data/aks_out3/*.npy"
)
OUTPUT_DIR = Path(os.environ.get("GP_OUTPUT_DIR", "/tmp/gp-alpha-search"))
SHOW_PLOT = os.environ.get("GP_SHOW_PLOT", "1").lower() in {
    "1", "true", "yes", "on"
}

# Persistent Ridge pool. mean(abs(beta)) is only the marginal-contribution
# screen; individual evolutionary fitness remains candidate Sharpe.
POOL_SIZE = int(os.environ.get("GP_POOL_SIZE", "16"))
POOL_CANDIDATES_PER_GENERATION = int(
    os.environ.get("GP_POOL_CANDIDATES_PER_GENERATION", "8")
)
POOL_RIDGE_HL = int(os.environ.get("GP_POOL_RIDGE_HL", str(1440 * 5)))
POOL_RIDGE_LAMBDA = float(os.environ.get("GP_POOL_RIDGE_LAMBDA", "1e-3"))
POOL_RIDGE_RECOMPUTE_EVERY = 1

# Group utilities remain enabled. Their GP key arguments are bounded Key
# terminals, so no generic default_group_capacity override is required.
GRAMMAR = GrammarPolicy()
'''
          replace_regex(
              r"# Search controls\..*?GRAMMAR = GrammarPolicy\(\)\n",
              constants,
          )

          helpers = '''def l1_norm(x):
    return purify(x / abs(x).sum(axis=-1))


def clean_returns_expr():
    roll_rets_value = var("roll_rets")
    return where(
        abs(roll_rets_value) <= 0.05,
        replace(roll_rets_value, 0, float("nan")),
        float("nan"),
    )


def _slice_sources(data, rows: int):
    if rows <= 0:
        return dict(data)
    sliced = {}
    for name, value in data.items():
        shape = tuple(getattr(value, "shape", ()))
        if not shape:
            sliced[name] = value
            continue
        if int(shape[0]) < rows:
            raise ValueError(
                f"source {name!r} has {int(shape[0]):,} rows; requested {rows:,}"
            )
        sliced[name] = value[:rows]
    return sliced


def _run_summary(result, runtime, *, compile_seconds: float, wall_seconds: float):
    return {
        "compile_seconds": float(compile_seconds),
        "wall_seconds": float(wall_seconds),
        "native_seconds": float(result.seconds),
        "cpu_seconds": float(result.cpu_seconds),
        "average_busy_cores": float(result.average_busy_cores),
        "threads": int(result.threads),
        "available_cpus": int(result.available_cpus),
        "parallel_mode": str(result.parallel_mode),
        "parallel_plan_mode": str(runtime.parallel_plan.mode),
        "parallel_plan_reason": str(runtime.parallel_plan.reason),
        "work_score": int(runtime.parallel_plan.work_score),
    }


def _derived_source(name, formula, sources):
    out_path = OUTPUT_DIR / "derived" / f"{name}.npy"
    out_path.parent.mkdir(parents=True, exist_ok=True)
    compile_started = time.perf_counter()
    runtime = compile_formula(
        formula,
        sources,
        n_instruments=N_INSTRUMENTS,
        prefetch_rows=PREFETCH_ROWS,
    )
    compile_seconds = time.perf_counter() - compile_started
    run_started = time.perf_counter()
    result = runtime.run(out_path=out_path, threads=THREADS)
    wall_seconds = time.perf_counter() - run_started
    metrics = _run_summary(
        result,
        runtime,
        compile_seconds=compile_seconds,
        wall_seconds=wall_seconds,
    )
    metrics.update({"name": name, "output_path": str(out_path)})
    print(
        f"derived={name} compile={compile_seconds:.3f}s run={wall_seconds:.3f}s "
        f"mode={metrics['parallel_mode']} busy_cores={metrics['average_busy_cores']:.2f}"
    )
    return result.load(), metrics


def depth_for_generation(generation: int) -> int:
    return 1 + (generation - 1) // DEPTH_GROW_EVERY
'''
          replace_regex(
              r"def l1_norm\(x\):.*?def depth_for_generation\(generation: int\) -> int:\n    return 1 \+ \(generation - 1\) // DEPTH_GROW_EVERY\n",
              helpers,
          )

          load_sources = '''def load_sources():
    """Load five million rows and materialize roll returns and its exact vol."""

    OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
    load_started = time.perf_counter()
    data = InputData(fp=INPUT_GLOB, idx=None, nrows=None)
    raw_sources = data.get_data()
    sources = _slice_sources(raw_sources, ROWS)
    load_seconds = time.perf_counter() - load_started

    roll_values, roll_metrics = _derived_source("roll_rets", roll_rets, sources)
    sources = sources | {"roll_rets": roll_values}

    # This is the same denominator used by default_alpha_pnl. Materializing it
    # once avoids rebuilding the identical long EWM in every Ridge generation.
    volatility_formula = ewm_std(
        clean_returns_expr(),
        span=ALPHA_PNL_HL,
    )
    volatility_values, volatility_metrics = _derived_source(
        "volatility",
        volatility_formula,
        sources,
    )
    sources = sources | {"volatility": volatility_values}
    return sources, {
        "load_seconds": float(load_seconds),
        "roll_rets": roll_metrics,
        "volatility": volatility_metrics,
    }


def build_search_state():
'''
          replace_regex(
              r"def load_sources\(\):.*?\ndef build_search_state\(\):\n",
              load_sources,
          )

          evaluate = '''def _split_batches(items, requested_shards: int):
    if not items:
        return []
    count = max(1, min(int(requested_shards), len(items)))
    width = (len(items) + count - 1) // count
    return [items[start : start + width] for start in range(0, len(items), width)]


def _fitness_batch(batch, sources, clean_rets, generation: int, shard: int, label: str):
    pnls = [
        default_alpha_pnl(
            alpha,
            roll_rets=clean_rets,
            is_tradable=var("is_tradable_out0"),
            hl=ALPHA_PNL_HL,
        )
        for _, alpha in batch
    ]
    pnl = pnls[0].sum(axis=1) if len(pnls) == 1 else cat(*pnls).sum(axis=1)
    score = pnl.mean(axis=0) / pnl.std(axis=0)

    compile_started = time.perf_counter()
    runtime = compile_formula(
        score,
        sources,
        n_instruments=N_INSTRUMENTS,
        prefetch_rows=PREFETCH_ROWS,
    )
    compile_seconds = time.perf_counter() - compile_started
    out_path = OUTPUT_DIR / "scratch" / f"fitness_{label}_g{generation:03d}_s{shard:02d}.npy"
    out_path.parent.mkdir(parents=True, exist_ok=True)
    run_started = time.perf_counter()
    result = runtime.run(out_path=out_path, threads=THREADS)
    wall_seconds = time.perf_counter() - run_started
    values = np.asarray(result.load(mmap_mode=None), dtype=np.float64).reshape(-1)
    out_path.unlink(missing_ok=True)
    if values.size != len(batch):
        raise RuntimeError(
            f"fitness returned {values.size} values for {len(batch)} candidates"
        )
    metrics = _run_summary(
        result,
        runtime,
        compile_seconds=compile_seconds,
        wall_seconds=wall_seconds,
    )
    metrics.update({"candidate_count": len(batch), "shard": shard})
    return [key for key, _ in batch], values, metrics


def _evaluate_alpha_batches(batch, sources, clean_rets, generation: int, shards: int, label: str):
    chunks = _split_batches(batch, shards)
    started = time.perf_counter()
    if len(chunks) == 1:
        outcomes = [
            _fitness_batch(chunks[0], sources, clean_rets, generation, 0, label)
        ]
    else:
        with ThreadPoolExecutor(max_workers=len(chunks)) as executor:
            futures = [
                executor.submit(
                    _fitness_batch,
                    chunk,
                    sources,
                    clean_rets,
                    generation,
                    index,
                    label,
                )
                for index, chunk in enumerate(chunks)
            ]
            outcomes = [future.result() for future in futures]
    wall_seconds = time.perf_counter() - started

    scores = {}
    stage_metrics = []
    for keys, values, metrics in outcomes:
        stage_metrics.append(metrics)
        for key, value in zip(keys, values):
            scores[key] = float(value) if np.isfinite(value) else -np.inf
    native_sum = sum(item["native_seconds"] for item in stage_metrics)
    return scores, {
        "wall_seconds": float(wall_seconds),
        "shards": len(chunks),
        "candidate_count": len(batch),
        "compile_seconds_sum": float(
            sum(item["compile_seconds"] for item in stage_metrics)
        ),
        "run_wall_seconds_sum": float(
            sum(item["wall_seconds"] for item in stage_metrics)
        ),
        "native_seconds_sum": float(native_sum),
        "effective_native_concurrency": float(
            native_sum / wall_seconds if wall_seconds else 0.0
        ),
        "plans": sorted(
            {
                f"{item['parallel_plan_mode']}: {item['parallel_plan_reason']}"
                for item in stage_metrics
            }
        ),
        "stages": stage_metrics,
    }


def evaluate_individuals(
    individuals,
    pset,
    sources,
    clean_rets,
    generation: int,
    fitness_cache,
):
    """Evaluate unique invalid formulas in concurrent cpp_stream batches."""

    pending = [individual for individual in individuals if not individual.fitness.valid]
    representatives = {}
    duplicate_groups = {}
    cached = 0
    for individual in pending:
        key = str(individual)
        if key in fitness_cache:
            individual.fitness.values = (fitness_cache[key],)
            cached += 1
            continue
        duplicate_groups.setdefault(key, []).append(individual)
        representatives.setdefault(key, individual)

    batch = [
        (key, alpha_expr(individual, pset))
        for key, individual in representatives.items()
    ]
    diagnostic = None
    if batch and PARALLEL_DIAGNOSTIC and generation == 1 and FITNESS_SHARDS > 1:
        serial_scores, serial_metrics = _evaluate_alpha_batches(
            batch,
            sources,
            clean_rets,
            generation,
            1,
            "serial",
        )
        sharded_scores, sharded_metrics = _evaluate_alpha_batches(
            batch,
            sources,
            clean_rets,
            generation,
            FITNESS_SHARDS,
            "sharded",
        )
        for key in serial_scores:
            left = serial_scores[key]
            right = sharded_scores[key]
            if not (
                left == right
                or np.isclose(left, right, rtol=1e-10, atol=1e-12, equal_nan=True)
            ):
                raise RuntimeError(
                    f"serial/sharded fitness mismatch for {key}: {left} versus {right}"
                )
        scores, metrics = sharded_scores, sharded_metrics
        diagnostic = {
            "serial_wall_seconds": serial_metrics["wall_seconds"],
            "sharded_wall_seconds": sharded_metrics["wall_seconds"],
            "speedup": (
                serial_metrics["wall_seconds"] / sharded_metrics["wall_seconds"]
                if sharded_metrics["wall_seconds"]
                else float("inf")
            ),
            "serial": serial_metrics,
            "sharded": sharded_metrics,
        }
    elif batch:
        scores, metrics = _evaluate_alpha_batches(
            batch,
            sources,
            clean_rets,
            generation,
            FITNESS_SHARDS,
            "search",
        )
    else:
        scores = {}
        metrics = {
            "wall_seconds": 0.0,
            "shards": 0,
            "candidate_count": 0,
            "compile_seconds_sum": 0.0,
            "run_wall_seconds_sum": 0.0,
            "native_seconds_sum": 0.0,
            "effective_native_concurrency": 0.0,
            "plans": [],
            "stages": [],
        }

    for key, value in scores.items():
        fitness_cache[key] = value
        for individual in duplicate_groups[key]:
            individual.fitness.values = (value,)
    metrics.update(
        {
            "invalid_count": len(pending),
            "unique_evaluated": len(batch),
            "cache_hits": cached,
            "duplicate_count": sum(len(group) - 1 for group in duplicate_groups.values()),
            "diagnostic": diagnostic,
        }
    )
    return metrics


def ridge_contributions(individuals, pset, sources, clean_rets, generation: int):
'''
          replace_regex(
              r"def evaluate_individuals\(.*?\ndef ridge_contributions\(individuals, pset, sources, clean_rets\):\n",
              evaluate,
          )

          ridge = '''def ridge_contributions(individuals, pset, sources, clean_rets, generation: int):
    """Return mean(abs(beta)) using the requested scaled nonnegative Ridge."""

    alphas = [alpha_expr(individual, pset) for individual in individuals]
    volatility = var("volatility")
    ridge_alphas = [shift(alpha, 1, 1) * volatility for alpha in alphas]
    hs = var("vw_halfspread_out0")
    # Parentheses are intentional: W is the purified inverse half-spread square.
    ridge_weights = purify(1.0 / (hs * hs))
    regression = Ridge(
        *ridge_alphas,
        y=clean_rets,
        weights=ridge_weights,
        hl=float(POOL_RIDGE_HL),
        lambda_=POOL_RIDGE_LAMBDA,
        nonneg=True,
        recompute_every=POOL_RIDGE_RECOMPUTE_EVERY,
    )
    mean_abs_beta = abs(get_beta(regression)).mean(axis=0)

    compile_started = time.perf_counter()
    runtime = compile_formula(
        mean_abs_beta,
        sources,
        n_instruments=N_INSTRUMENTS,
        prefetch_rows=PREFETCH_ROWS,
    )
    compile_seconds = time.perf_counter() - compile_started
    out_path = OUTPUT_DIR / "scratch" / f"ridge_g{generation:03d}.npy"
    out_path.parent.mkdir(parents=True, exist_ok=True)
    run_started = time.perf_counter()
    result = runtime.run(out_path=out_path, threads=THREADS)
    wall_seconds = time.perf_counter() - run_started
    values = np.asarray(result.load(mmap_mode=None), dtype=np.float64).reshape(-1)
    out_path.unlink(missing_ok=True)
    if values.size != len(individuals):
        raise RuntimeError(
            f"Ridge returned {values.size} coefficients for {len(individuals)} alphas"
        )
    metrics = _run_summary(
        result,
        runtime,
        compile_seconds=compile_seconds,
        wall_seconds=wall_seconds,
    )
    metrics["alpha_count"] = len(individuals)
    return (
        np.nan_to_num(values, nan=0.0, posinf=0.0, neginf=0.0),
        metrics,
    )


def update_pool(pool, population, pset, sources, clean_rets, toolbox, generation: int):
'''
          replace_regex(
              r"def ridge_contributions\(.*?\ndef update_pool\(pool, population, pset, sources, clean_rets, toolbox\):\n",
              ridge,
          )

          update_pool = '''def update_pool(pool, population, pset, sources, clean_rets, toolbox, generation: int):
    """Merge strong population members into the pool and rerank by Ridge beta."""

    candidates = list(pool.values()) + tools.selBest(
        population,
        min(POOL_CANDIDATES_PER_GENERATION, len(population)),
    )
    unique = {}
    for individual in candidates:
        unique.setdefault(str(individual), individual)
    candidates = list(unique.values())

    contribution, ridge_metrics = ridge_contributions(
        candidates,
        pset,
        sources,
        clean_rets,
        generation,
    )
    order = np.argsort(contribution)[::-1][:POOL_SIZE]
    next_pool = {
        str(candidates[index]): toolbox.clone(candidates[index])
        for index in order
        if contribution[index] > 0.0
    }
    next_contribution = {
        str(candidates[index]): float(contribution[index])
        for index in order
        if contribution[index] > 0.0
    }
    return next_pool, next_contribution, ridge_metrics


def vary(population, pset, toolbox, next_depth: int):
'''
          replace_regex(
              r"def update_pool\(.*?\ndef vary\(population, pset, toolbox, next_depth: int\):\n",
              update_pool,
          )

          main = '''def main():
    if ROWS <= 0:
        raise ValueError("GP_ROWS must be positive for this benchmark/search script")
    if GENERATIONS <= 0 or DEPTH_GROW_EVERY <= 0:
        raise ValueError("GP_GENERATIONS and GP_DEPTH_GROW_EVERY must be positive")
    if FITNESS_SHARDS <= 0:
        raise ValueError("GP_FITNESS_SHARDS must be positive")

    random.seed(SEED)
    np.random.seed(SEED)
    total_started = time.perf_counter()

    sources, derived_metrics = load_sources()
    clean_rets = clean_returns_expr()
    pset, toolbox = build_search_state()

    population = [new_individual(pset, 1) for _ in range(POPULATION_SIZE)]
    hall_of_fame = tools.HallOfFame(20)

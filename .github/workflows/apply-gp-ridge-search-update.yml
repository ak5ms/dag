            "ridge_compile_seconds": ridge_metrics["compile_seconds"],
            "ridge_wall_seconds": ridge_metrics["wall_seconds"],
            "ridge_native_seconds": ridge_metrics["native_seconds"],
            "ridge_average_busy_cores": ridge_metrics["average_busy_cores"],
            "ridge_parallel_plan": (
                f"{ridge_metrics['parallel_plan_mode']}: "
                f"{ridge_metrics['parallel_plan_reason']}"
            ),
            "generation_wall_seconds": generation_wall,
            "cumulative_search_seconds": cumulative_wall,
            "projected_50_generation_seconds": projected_total,
        }
        history.append(row)
        print(
            f"generation={generation:3d} depth={depth:2d} "
            f"best={row['best_sharpe']:9.5f} mean={row['mean_sharpe']:9.5f} "
            f"pool={len(pool):2d} fitness={row['fitness_wall_seconds']:8.3f}s "
            f"ridge={row['ridge_wall_seconds']:8.3f}s "
            f"total={generation_wall:8.3f}s projected={projected_total / 60.0:7.2f}m"
        )
        if generation == min(3, GENERATIONS) and projected_total > 3600.0:
            print(
                "projected runtime exceeds one hour; the Ridge/final-reduction "
                "plan remains serial, while candidate fitness is externally sharded."
            )

        if generation < GENERATIONS:
            population = vary(
                population,
                pset,
                toolbox,
                depth_for_generation(generation + 1),
            )

    frame = pd.DataFrame(history)
    history_path = OUTPUT_DIR / "gp_search_history.csv"
    frame.to_csv(history_path, index=False)

    print("\nBest formulas by Sharpe:")
    for rank, individual in enumerate(hall_of_fame[:10], 1):
        print(f"{rank:2d}  sharpe={individual.fitness.values[0]:9.5f}  {individual}")

    print("\nPersistent Ridge pool:")
    for rank, (text, individual) in enumerate(
        sorted(pool.items(), key=lambda item: pool_contribution[item[0]], reverse=True),
        1,
    ):
        print(
            f"{rank:2d}  mean_abs_beta={pool_contribution[text]:.8g}  "
            f"sharpe={individual.fitness.values[0]:9.5f}  {text}"
        )

    plot_path = OUTPUT_DIR / "gp_search_history.png"
    plt.figure(figsize=(9, 5))
    plt.plot(frame["generation"], frame["best_sharpe"], label="best Sharpe")
    plt.plot(frame["generation"], frame["mean_sharpe"], label="mean Sharpe")
    plt.plot(frame["generation"], frame["median_sharpe"], label="median Sharpe")
    plt.xlabel("Generation")
    plt.ylabel("Fitness (Sharpe)")

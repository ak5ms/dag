name: Export strongly typed GP source
# export revision: 5 (source plus full Git history)

on:
  push:
    branches:
      - agent/strongly-typed-gp
    paths:
      - ".github/workflows/export-strongly-typed-gp-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strongly-typed-gp
          fetch-depth: 0
      - name: Package source and repository history
        shell: bash
        run: |
          tar --exclude=.git -czf /tmp/dag-strongly-typed-gp-source.tar.gz .
          git bundle create /tmp/dag-strongly-typed-gp.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: dag-strongly-typed-gp-source-${{ github.sha }}
          path: |
            /tmp/dag-strongly-typed-gp-source.tar.gz
            /tmp/dag-strongly-typed-gp.bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

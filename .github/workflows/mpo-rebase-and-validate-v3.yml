name: mpo-rebase-and-validate-v3

on:
  push:
    branches: [mpo-agent-export]
    paths:
      - '.github/workflows/mpo-rebase-and-validate-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and select a valid linear rebase
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          original_mpo=$(git rev-parse origin/mpo)
          main_head=$(git rev-parse origin/main)
          root="$RUNNER_TEMP/mpo-v3"
          rm -rf "$root" && mkdir -p "$root"
          selected=""
          selected_strategy=""

          for strategy in theirs ours; do
            candidate="$root/$strategy"
            git clone --no-local "$GITHUB_WORKSPACE" "$candidate"
            cd "$candidate"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
            git checkout -B mpo-rebased "$original_mpo"
            if ! GIT_EDITOR=true git rebase "$main_head" -X "$strategy"; then
              git rebase --abort || true
              continue
            fi

            # Preserve the current main multi-root compiler/runtime and its tests.
            main_owned=(
              benchmarks/cpp_stream_multi_output_audit.md
              scripts/benchmark_cpp_stream_multi_output_subgraph.py
              src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/output.hpp
              src/trading_dsl_engine/cpp_stream/python/compiler_support.py
              src/trading_dsl_engine/cpp_stream/python/lowering_multi.py
              src/trading_dsl_engine/cpp_stream/python/output_projection.py
              src/trading_dsl_engine/cpp_stream/python/outputs.py
              tests/trading_dsl_engine/cpp_stream/test_multi_output_runtime.py
              tests/trading_dsl_engine/cpp_stream/test_output_projection.py
            )
            for path in "${main_owned[@]}"; do
              [[ -e "$path" ]] || git checkout "$main_head" -- "$path"
            done

            # Historical standalone benchmark output is not part of the operator.
            rm -f \
              docs/benchmarks/cpp_stream_optimizer_node.json \
              docs/benchmarks/cpp_stream_optimizer_node_benchmark.txt \
              docs/benchmarks/cpp_stream_optimizer_node_validation.txt \
              docs/benchmarks/mpo_optimizer_final_status.md \
              docs/benchmarks/mpo_optimizer_full_validation.txt \
              scripts/benchmark_cpp_stream_optimizer_node.py \
              scripts/benchmark_mpo_cvxpygen.py \
              scripts/benchmark_mpo_cvxpygen_native.c
            if ! git diff --quiet; then
              git add -A
              git commit -m "Rebase MPO onto current main and remove obsolete benchmarks"
            fi

            python -m pip install --upgrade pip
            python -m pip install -e .
            python -m pip install pytest numpy scipy cvxpy clarabel includeigen pybind11 jinja2 jax equinox astropy
            export PYTHONPATH=src
            export JAX_ENABLE_X64=1

            # Require focused tests to exercise shared projections and downstream
            # formula composition, not merely a standalone batch solver.
            mpo_test="tests/trading_dsl_engine/cpp_stream/test_optimizer_node.py"
            [[ -e "$mpo_test" ]] || continue
            grep -Eq 'get_field|field' "$mpo_test" || continue
            grep -Eq 'compile_formula' "$mpo_test" || continue
            grep -Eq 'downstream|shift|multi.output|multiple.output' "$mpo_test" || continue

            test_paths=(
              "$mpo_test"
              tests/trading_dsl_engine/cpp_stream/test_multi_output_runtime.py
              tests/trading_dsl_engine/cpp_stream/test_output_projection.py
              tests/trading_dsl_engine/cpp_stream/test_cat_ridge.py
              tests/trading_dsl_engine/cpp_stream/test_cpp_stream.py
            )
            [[ -e tests/flows/test_mpo.py ]] && test_paths+=(tests/flows/test_mpo.py)
            if python -m pytest -q -o addopts="" "${test_paths[@]}"; then
              selected="$candidate"
              selected_strategy="$strategy"
              break
            fi
          done

          [[ -n "$selected" ]] || { echo 'No candidate passed MPO composition and current-main tests' >&2; exit 1; }
          cd "$selected"
          git merge-base --is-ancestor "$main_head" HEAD
          test "$(git rev-list --merges "$main_head"..HEAD --count)" -eq 0
          final_sha=$(git rev-parse HEAD)
          git push --force-with-lease=refs/heads/mpo:"$original_mpo" origin HEAD:refs/heads/mpo
          {
            echo "final_sha=$final_sha"
            echo "main_sha=$main_head"
            echo "strategy=$selected_strategy"
          } | tee "$RUNNER_TEMP/mpo-v3-result.txt"
          gh pr edit 155 --repo "$GITHUB_REPOSITORY" --body "Rebased linearly onto current main at \`$main_head\`. MPO remains a first-class cpp_stream object operator: named \`get_field\` projections share one physical optimizer stage, can feed downstream formulas, and work in heterogeneous \`compile_formula([...])\` outputs. Current main's multi-output/CSE runtime is preserved. Obsolete standalone optimizer/CVXPYgen benchmark artifacts were removed. Focused MPO, output-projection, multi-output, Ridge, and cpp_stream tests passed in the rebase workflow.\n\nValidated head: \`$final_sha\`."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpo-rebase-v3-result
          path: ${{ runner.temp }}/mpo-v3-result.txt
          if-no-files-found: ignore
          retention-days: 2

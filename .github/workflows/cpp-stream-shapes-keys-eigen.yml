name: cpp_stream shapes keys eigen

on:
  pull_request:
    branches: [cpp-stream-backend]
    paths:
      - "src/trading_dsl_engine/cpp_stream/**"
      - "src/trading_dsl_engine/base/keys.py"
      - "src/flows/pov.py"
      - "src/flows/riskmodel.py"
      - "src/flows/roll_rets_keys.py"
      - "tests/trading_dsl_engine/cpp_stream/test_reduction_dsl_full.py"
      - "scripts/benchmark_cpp_stream_npy_output.py"
      - "scripts/benchmark_cpp_stream_roll_rets_keys.py"
      - "scripts/benchmark_cpp_stream_eigen_solvers.py"
      - ".github/workflows/cpp-stream-shapes-keys-eigen.yml"
  workflow_dispatch:

jobs:
  full-dsl-shapes-and-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Show CPU topology
        run: |
          lscpu
          lscpu -e=CPU,CORE,SOCKET,NODE
          python - <<'PY'
          import os
          print("affinity=", sorted(os.sched_getaffinity(0)))
          PY
      - name: Install focused dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy numba pytest jinja2 jax equinox astropy
          includeigen pybind11
      - name: Test full reduction DSL and automatic shapes
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_reductions.py
          tests/trading_dsl_engine/cpp_stream/test_reductions_parallel.py
          tests/trading_dsl_engine/cpp_stream/test_reduction_dsl_full.py
      - name: Benchmark direct npy output
        env:
          PYTHONPATH: src
          CPP_STREAM_NPY_ROWS: "5000000"
          CPP_STREAM_NPY_INSTRUMENTS: "9"
          CPP_STREAM_NPY_RUNS: "10"
          CPP_STREAM_NPY_WARMUPS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_npy_output.py
      - name: Benchmark row-scalar roll_rets key hint
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
          CPP_STREAM_ROLL_KEYS_ROWS: "5000000"
          CPP_STREAM_ROLL_KEYS_INSTRUMENTS: "9"
          CPP_STREAM_ROLL_KEYS_RUNS: "10"
          CPP_STREAM_ROLL_KEYS_WARMUPS: "1"
          CPP_STREAM_ROLL_KEYS_THREADS: "1,4"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_roll_rets_keys.py
      - name: Benchmark fixed-size Eigen solvers
        env:
          PYTHONPATH: src
          CPP_STREAM_EIGEN_ROWS: "5000000"
          CPP_STREAM_EIGEN_INSTRUMENTS: "9"
          CPP_STREAM_EIGEN_RUNS: "10"
          CPP_STREAM_EIGEN_WARMUPS: "1"
          CPP_STREAM_EIGEN_AUDIT_ROWS: "10000"
        run: python scripts/benchmark_cpp_stream_eigen_solvers.py

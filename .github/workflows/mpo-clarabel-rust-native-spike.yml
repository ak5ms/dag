name: MPO Clarabel Rust native spike

on:
  push:
    branches: [agent/mpo-clarabel-rust-native-spike]

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]' graphviz
      - name: Benchmark generic and target-cpu-native Clarabel
        env:
          PYTHONPATH: src:.
          MPLBACKEND: Agg
          MPO_NATIVE_ROWS: "5000"
          MPO_NATIVE_RUNS: "5"
        run: python scripts/spike_clarabel_rust_native.py

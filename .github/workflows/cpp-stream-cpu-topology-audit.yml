name: cpp_stream CPU topology audit

on:
  pull_request:
    branches: [cpp-stream-backend]
    paths:
      - ".github/workflows/cpp-stream-cpu-topology-audit.yml"

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          lscpu
          lscpu -e=CPU,CORE,SOCKET,NODE
          for cpu in /sys/devices/system/cpu/cpu[0-9]*; do
            id=${cpu##*cpu}
            printf "cpu=%s package=" "$id"
            cat "$cpu/topology/physical_package_id"
            printf "cpu=%s core=" "$id"
            cat "$cpu/topology/core_id"
          done

name: MPO Clarabel correctness debug

on:
  push:
    branches: [agent/mpo-clarabel-correctness-debug]

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]' graphviz
      - name: Debug statuses and feasibility
        env:
          PYTHONPATH: src:.
          MPLBACKEND: Agg
          MPO_FINAL_ROWS: "5000"
          MPO_FINAL_RUNS: "1"
        run: python scripts/debug_mpo_status_feasibility.py

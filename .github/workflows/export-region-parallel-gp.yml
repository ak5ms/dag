name: Export region-parallel GP source

on:
  push:
    branches:
      - agent/region-parallel-gp
    paths:
      - ".github/workflows/export-region-parallel-gp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/region-parallel-gp
          fetch-depth: 1
      - name: Package source
        shell: bash
        run: tar --exclude=.git -czf /tmp/dag-region-parallel-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dag-region-parallel-source-${{ github.sha }}
          path: /tmp/dag-region-parallel-source.tar.gz
          if-no-files-found: error
          retention-days: 1

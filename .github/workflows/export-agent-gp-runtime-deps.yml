name: Export agent GP runtime dependencies

on:
  pull_request:
    branches:
      - agent/strongly-typed-gp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build local runtime bundle
        shell: bash
        run: |
          python -m pip install --target /tmp/gp-runtime \
            deap==1.4.2 includeigen pybind11
          tar -C /tmp -czf /tmp/gp-runtime.tar.gz gp-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: gp-runtime-${{ github.sha }}
          path: /tmp/gp-runtime.tar.gz
          if-no-files-found: error
          retention-days: 1

name: apply Ridge periodic recomputation

on:
  push:
    branches:
      - agent/cpp-stream-operators
    paths:
      - ".github/workflows/apply-ridge-recompute.yml"
      - "scripts/apply_ridge_recompute.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ridge-recompute-agent-cpp-stream-operators
  cancel-in-progress: false

jobs:
  implement-test-benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      JAX_ENABLE_X64: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy numba pytest jinja2 jax equinox astropy
          includeigen pybind11 matplotlib graphviz

      - name: Benchmark the unmodified default Ridge path
        env:
          CPP_STREAM_RIDGE_ROWS: "250000"
          CPP_STREAM_RIDGE_INSTRUMENTS: "9"
          CPP_STREAM_RIDGE_RUNS: "10"
          CPP_STREAM_RIDGE_WARMUPS: "1"
          CPP_STREAM_RIDGE_CASE: "stateful_cat,stateless_beta"
        run: |
          git worktree add --detach /tmp/dag-ridge-before "${{ github.event.before }}"
          (
            cd /tmp/dag-ridge-before
            python scripts/benchmark_cpp_stream_ridge.py
          ) | tee /tmp/ridge_before.txt

      - name: Apply implementation
        run: python scripts/apply_ridge_recompute.py

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            src/trading_dsl_engine/base/dsl.py \
            src/trading_dsl_engine/ir/ops.py \
            src/trading_dsl_engine/ir/frontend.py \
            src/trading_dsl_engine/cpp_stream/python/codegen.py \
            tests/trading_dsl_engine/cpp_stream/test_ridge_recompute.py \
            scripts/benchmark_cpp_stream_ridge_recompute.py

      - name: Run focused Ridge and code-generation tests
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_ridge_recompute.py
          tests/trading_dsl_engine/cpp_stream/test_cat_ridge.py
          tests/trading_dsl_engine/cpp_stream/test_codegen.py

      - name: Benchmark patched default Ridge path
        env:
          CPP_STREAM_RIDGE_ROWS: "250000"
          CPP_STREAM_RIDGE_INSTRUMENTS: "9"
          CPP_STREAM_RIDGE_RUNS: "10"
          CPP_STREAM_RIDGE_WARMUPS: "1"
          CPP_STREAM_RIDGE_CASE: "stateful_cat,stateless_beta"
        run: python scripts/benchmark_cpp_stream_ridge.py | tee /tmp/ridge_after.txt

      - name: Benchmark periodic refresh intervals and projections
        env:
          CPP_STREAM_RIDGE_RECOMPUTE_RUNS: "10"
          CPP_STREAM_RIDGE_RECOMPUTE_WARMUPS: "1"
          CPP_STREAM_RIDGE_RECOMPUTE_INTERVALS: "1,2,4,8,16,64"
          CPP_STREAM_RIDGE_RECOMPUTE_SCALING_INTERVALS: "1,8,64"
          CPP_STREAM_RIDGE_BASELINE_LOG: /tmp/ridge_before.txt
          CPP_STREAM_RIDGE_HEAD_LOG: /tmp/ridge_after.txt
        run: |
          mkdir -p src/trading_dsl_engine/cpp_stream
          cp /tmp/ridge_before.txt \
            src/trading_dsl_engine/cpp_stream/RIDGE_RECOMPUTE_K1_BEFORE.txt
          cp /tmp/ridge_after.txt \
            src/trading_dsl_engine/cpp_stream/RIDGE_RECOMPUTE_K1_AFTER.txt
          python scripts/benchmark_cpp_stream_ridge_recompute.py

      - name: Commit implementation and measured results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/trading_dsl_engine/base/dsl.py \
            src/trading_dsl_engine/ir/ops.py \
            src/trading_dsl_engine/ir/frontend.py \
            src/trading_dsl_engine/cpp_stream/python/codegen.py \
            src/trading_dsl_engine/cpp_stream/cpp/stackdsl/utils.hpp \
            src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/ridge.hpp \
            src/trading_dsl_engine/cpp_stream/RIDGE_RECOMPUTE_BENCHMARK.md \
            src/trading_dsl_engine/cpp_stream/RIDGE_RECOMPUTE_BENCHMARK.json \
            src/trading_dsl_engine/cpp_stream/RIDGE_RECOMPUTE_K1_BEFORE.txt \
            src/trading_dsl_engine/cpp_stream/RIDGE_RECOMPUTE_K1_AFTER.txt
          git commit -m "Add periodic Ridge recomputation"
          git push origin HEAD:refs/heads/agent/cpp-stream-operators

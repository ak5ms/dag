name: MPO objective horizon verify v2

on:
  push:
    branches: [agent/mpo-objective-horizon-verify]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mpo-objective-horizon-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed implementation patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/mpo-objective-horizon-verify
          git show origin/agent/mpo-objective-horizon-verify:.github/workflows/mpo-objective-horizon-verify.yml > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/source.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          script = script.replace("if count != 1:\n", "if count < 1:\n", 1)
          exec(compile(script, '/tmp/apply_named_expression.py', 'exec'))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trading_dsl_engine/cpp_stream
          git commit -m 'Support generic post-solve CVXPY expressions'
          git push origin HEAD:agent/mpo-objective-horizon-cleanup
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]' graphviz
      - name: Run generic named-expression regression
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q -o addopts='' tests/trading_dsl_engine/cpp_stream/test_cvxpy_named_expressions.py

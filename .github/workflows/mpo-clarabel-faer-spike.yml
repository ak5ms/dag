name: MPO Clarabel FAER spike

on:
  push:
    branches: [agent/mpo-clarabel-faer-spike]

jobs:
  faer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]' graphviz
      - name: Benchmark QDLDL and FAER
        env:
          PYTHONPATH: src:.
          MPLBACKEND: Agg
          MPO_FAER_ROWS: "5000"
          MPO_FAER_RUNS: "5"
        run: python scripts/spike_mpo_clarabel_faer.py

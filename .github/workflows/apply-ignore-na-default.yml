name: apply cpp_stream reduction ignore_na default

on:
  push:
    branches: [cpp-stream-backend]
    paths: [.github/workflows/apply-ignore-na-default.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpp-stream-backend
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply API and native changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new))

          replace(
              "src/trading_dsl_engine/base/parser.py",
              '''    def sum(self, axis=None):
        from trading_dsl_engine.base.dsl import reduction

        return reduction("sum", self, axis=axis)

    def mean(self, axis=None):
        from trading_dsl_engine.base.dsl import reduction

        return reduction("mean", self, axis=axis)

    def std(self, axis=None, ddof=0):
        from trading_dsl_engine.base.dsl import reduction

        return reduction("std", self, axis=axis, ddof=ddof)
''',
              '''    def sum(self, axis=None, ignore_na=True):
        from trading_dsl_engine.base.dsl import reduction

        return reduction("sum", self, axis=axis, ignore_na=ignore_na)

    def mean(self, axis=None, ignore_na=True):
        from trading_dsl_engine.base.dsl import reduction

        return reduction("mean", self, axis=axis, ignore_na=ignore_na)

    def std(self, axis=None, ddof=0, ignore_na=True):
        from trading_dsl_engine.base.dsl import reduction

        return reduction(
            "std", self, axis=axis, ddof=ddof, ignore_na=ignore_na
        )
''',
          )
          replace(
              "src/trading_dsl_engine/base/dsl.py",
              '''def reduction(name: str, x, *, axis=None, ddof=0) -> Expr:
    if name not in {"sum", "mean", "std"}:
        raise ValueError(f"unsupported reduction {name!r}")
    kwargs = []
    if axis is not None:
        kwargs.append(("axis", _axis_expr(axis)))
    if name == "std" and ddof != 0:
        kwargs.append(("ddof", ensure_expr(ddof)))
    return Call(name, (ensure_expr(x),), tuple(kwargs))
''',
              '''def reduction(name: str, x, *, axis=None, ddof=0, ignore_na=True) -> Expr:
    if name not in {"sum", "mean", "std"}:
        raise ValueError(f"unsupported reduction {name!r}")
    kwargs = []
    if axis is not None:
        kwargs.append(("axis", _axis_expr(axis)))
    if name == "std" and ddof != 0:
        kwargs.append(("ddof", ensure_expr(ddof)))
    if not ignore_na:
        kwargs.append(("ignore_na", ensure_expr(ignore_na)))
    return Call(name, (ensure_expr(x),), tuple(kwargs))
''',
          )
          replace(
              "src/trading_dsl_engine/base/dsl.py",
              '''    "sum": _dsl_signature("x", "axis", defaults={"axis": None}),
    "mean": _dsl_signature("x", "axis", defaults={"axis": None}),
    "std": _dsl_signature("x", "axis", "ddof", defaults={"axis": None, "ddof": 0}),
''',
              '''    "sum": _dsl_signature(
        "x", "axis", "ignore_na", defaults={"axis": None, "ignore_na": True}
    ),
    "mean": _dsl_signature(
        "x", "axis", "ignore_na", defaults={"axis": None, "ignore_na": True}
    ),
    "std": _dsl_signature(
        "x",
        "axis",
        "ddof",
        "ignore_na",
        defaults={"axis": None, "ddof": 0, "ignore_na": True},
    ),
''',
          )
          replace(
              "src/trading_dsl_engine/ir/ops.py",
              '''class ReductionOp:
    kind: str
    axes: tuple[int, ...]
    ddof: int = 0
''',
              '''class ReductionOp:
    kind: str
    axes: tuple[int, ...]
    ddof: int = 0
    ignore_na: bool = True
''',
          )
          replace(
              "src/trading_dsl_engine/ir/frontend.py",
              '''def _reduction_arguments(call: Call) -> tuple[Expr, Expr | None, int]:
    if call.fn not in {"sum", "mean", "std"}:
        raise FormulaIRCompileError(f"invalid reduction {call.fn!r}")
    names = ("x", "axis", "ddof") if call.fn == "std" else ("x", "axis")
    values: dict[str, Expr] = {}
''',
              '''def _reduction_arguments(
    call: Call,
) -> tuple[Expr, Expr | None, int, bool]:
    if call.fn not in {"sum", "mean", "std"}:
        raise FormulaIRCompileError(f"invalid reduction {call.fn!r}")
    names = (
        ("x", "axis", "ddof", "ignore_na")
        if call.fn == "std"
        else ("x", "axis", "ignore_na")
    )
    values: dict[str, Expr] = {}
''',
          )
          replace(
              "src/trading_dsl_engine/ir/frontend.py",
              '''    ddof = _literal_int(values.get("ddof", Number(0.0)), "std ddof", 0)
    return values["x"], values.get("axis"), ddof
''',
              '''    ddof = _literal_int(values.get("ddof", Number(0.0)), "std ddof", 0)
    ignore_na = _literal_bool(
        values.get("ignore_na", Number(1.0)), "reduction ignore_na"
    )
    return values["x"], values.get("axis"), ddof, ignore_na
''',
          )
          replace(
              "src/trading_dsl_engine/ir/frontend.py",
              '''        if node.fn in {"sum", "mean", "std"}:
            expression, axis, ddof = _reduction_arguments(node)
''',
              '''        if node.fn in {"sum", "mean", "std"}:
            expression, axis, ddof, ignore_na = _reduction_arguments(node)
''',
          )
          replace(
              "src/trading_dsl_engine/ir/frontend.py",
              '''                ReductionOp(node.fn, axes, ddof),
''',
              '''                ReductionOp(node.fn, axes, ddof, ignore_na),
''',
          )
          replace(
              "src/trading_dsl_engine/cpp_stream/python/codegen.py",
              '''            Name(policy),
            IntArg(stage.op.ddof),
            BoolArg(stage.op.temporal),
''',
              '''            Name(policy),
            IntArg(stage.op.ddof),
            BoolArg(stage.op.ignore_na),
            BoolArg(stage.op.temporal),
''',
          )
          replace(
              "src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/reduction.hpp",
              '''template <class Policy, std::size_t Size, std::size_t Ddof>
struct ReductionState {
    alignas(64) std::array<double, Size> total{};
    alignas(64) std::array<double, Size> mean{};
    alignas(64) std::array<double, Size> m2{};
    alignas(64) std::array<std::uint64_t, Size> count{};

    STACKDSL_HOT void reset() noexcept {
        total.fill(0.0);
        mean.fill(0.0);
        m2.fill(0.0);
        count.fill(0);
    }

    STACKDSL_HOT void add(std::size_t index, double value) noexcept {
        if (!finite(value)) return;
''',
              '''template <
    class Policy,
    std::size_t Size,
    std::size_t Ddof,
    bool IgnoreNa
>
struct ReductionState {
    alignas(64) std::array<double, Size> total{};
    alignas(64) std::array<double, Size> mean{};
    alignas(64) std::array<double, Size> m2{};
    alignas(64) std::array<std::uint64_t, Size> count{};
    alignas(64) std::array<bool, Size> invalid{};

    STACKDSL_HOT void reset() noexcept {
        total.fill(0.0);
        mean.fill(0.0);
        m2.fill(0.0);
        count.fill(0);
        if constexpr (!IgnoreNa) invalid.fill(false);
    }

    STACKDSL_HOT void add(std::size_t index, double value) noexcept {
        if (!finite(value)) {
            if constexpr (!IgnoreNa) invalid[index] = true;
            return;
        }
''',
          )
          replace(
              "src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/reduction.hpp",
              '''    STACKDSL_HOT double result(std::size_t index) const noexcept {
        if (count[index] == 0) return kNaN;
''',
              '''    STACKDSL_HOT double result(std::size_t index) const noexcept {
        if constexpr (!IgnoreNa) {
            if (invalid[index]) return kNaN;
        }
        if (count[index] == 0) return kNaN;
''',
          )
          replace(
              "src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/reduction.hpp",
              '''    class Policy,
    std::size_t Ddof,
    bool Temporal
>
struct ReductionNode {
''',
              '''    class Policy,
    std::size_t Ddof,
    bool IgnoreNa,
    bool Temporal
>
struct ReductionNode {
''',
          )
          replace(
              "src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/reduction.hpp",
              '''    using State = ReductionState<Policy, output_size, Ddof>;
''',
              '''    using State = ReductionState<Policy, output_size, Ddof, IgnoreNa>;
''',
          )

          tests = Path("tests/trading_dsl_engine/cpp_stream/test_reductions.py")
          text = tests.read_text()
          addition = '''

@pytest.mark.parametrize(
    ("kind", "kwargs"),
    [
        ("sum", {}),
        ("mean", {}),
        ("std", {"ddof": 1}),
    ],
)
def test_ignore_na_false_propagates_missing_values(
    tmp_path: Path, kind: str, kwargs: dict[str, int]
) -> None:
    x = np.arange(24, dtype=np.float64).reshape(8, 3)
    x[2, 1] = np.nan
    expression = getattr(var("x"), kind)(
        axis=0, ignore_na=False, **kwargs
    )
    _, _, actual = _run(tmp_path, expression, {"x": x})
    expected = getattr(np, kind)(x, axis=0, **kwargs)
    np.testing.assert_allclose(actual, expected, equal_nan=True)
    assert np.isfinite(actual[[0, 2]]).all()
    assert np.isnan(actual[1])


def test_string_reduction_ignore_na_defaults_true(tmp_path: Path) -> None:
    x = np.arange(24, dtype=np.float64).reshape(4, 6)
    x[1, 3] = np.nan
    runtime = compile_formula("sum(x, axis=0)", {"x": x}, n_instruments=6)
    result = runtime.run(out_path=tmp_path / "default-ignore-na.bin")
    actual = np.fromfile(result.output_path, dtype=np.float64)
    np.testing.assert_allclose(actual, np.nansum(x, axis=0))
'''
          if addition.strip() in text:
              raise SystemExit("reduction ignore_na tests already present")
          tests.write_text(text.rstrip() + addition + "\n")

          replace(
              "src/trading_dsl_engine/cpp_stream/REDUCTIONS.md",
              '''Temporal reductions and `emit("last")` are terminal because they remove the streaming
time dimension. Row reductions can appear anywhere in the graph. `sum`, `mean`, and
`std` ignore non-finite observations; empty groups and standard deviations with
`count <= ddof` produce NaN. Standard deviation uses an online Welford accumulator.
''',
              '''Temporal reductions and `emit("last")` are terminal because they remove the streaming
time dimension. Row reductions can appear anywhere in the graph. `sum`, `mean`, and
`std` use `ignore_na=True` by default and therefore skip non-finite observations.
Passing `ignore_na=False` propagates a non-finite observation to that reduction group.
Empty groups and standard deviations with `count <= ddof` produce NaN. Standard
deviation uses an online Welford accumulator.
''',
          )
          PY
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy pytest jinja2 includeigen
      - name: Run reduction tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q -o addopts="" tests/trading_dsl_engine/cpp_stream/test_reductions.py
      - name: Commit backend change
        shell: bash
        run: |
          rm .github/workflows/apply-ignore-na-default.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Default streaming reductions to ignore_na"
          git push origin HEAD:cpp-stream-backend

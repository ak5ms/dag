name: GP cpp_stream compile fuzz

on:
  push:
    branches:
      - agent/strongly-typed-gp
    paths:
      - "src/flows/gp/**"
      - "tests/flows/gp/**"
      - ".github/workflows/gp-compile-fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      TRADING_DSL_ENGINE_CPP_LTO: "0"
      TRADING_DSL_ENGINE_CPP_NATIVE: "0"
      GP_IR_FUZZ_SAMPLES: "2000"
      GP_NATIVE_FUZZ_SAMPLES: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run focused GP grammar tests
        run: python -m pytest -q -o addopts="" tests/flows/gp/test_pset.py
      - name: Run GP compile fuzz
        id: fuzz
        shell: bash
        run: |
          set +e
          python -m pytest -q -s -o addopts="" tests/flows/gp/test_compile_fuzz.py 2>&1 | tee /tmp/gp-compile-fuzz.log
          status=${PIPESTATUS[0]}
          echo "pytest_status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload compile-fuzz diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-compile-fuzz-log
          path: /tmp/gp-compile-fuzz.log
          if-no-files-found: warn

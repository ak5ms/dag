name: GP cpp_stream compile fuzz

on:
  push:
    branches:
      - agent/strongly-typed-gp
      - agent/strongly-typed-gp-tensor-work
    paths:
      - "src/flows/gp/**"
      - "src/flows/pov.py"
      - "src/trading_dsl_engine/cpp_stream/**"
      - "scripts/run_gp_alpha_search.py"
      - "tests/flows/gp/**"
      - "tests/trading_dsl_engine/cpp_stream/test_roll_rets.py"
      - ".github/workflows/gp-compile-fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      TRADING_DSL_ENGINE_CPP_LTO: "0"
      TRADING_DSL_ENGINE_CPP_NATIVE: "0"
      GP_IR_FUZZ_SAMPLES: "2000"
      GP_NATIVE_FUZZ_SAMPLES: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Check search script
        run: python -m py_compile scripts/run_gp_alpha_search.py
      - name: Dump exact GP signatures
        run: python -m flows.gp.signatures | tee /tmp/gp-signatures.txt
      - name: Run focused GP, tensor, and roll-return tests
        shell: bash
        run: |
          set +e
          python -m pytest -q -o addopts="" \
            tests/flows/gp/test_pset.py \
            tests/flows/gp/test_grammar_controls.py \
            tests/flows/gp/test_tensor_gp.py \
            tests/flows/gp/test_tensor_shape_safety.py \
            tests/flows/gp/test_tensor_runtime.py \
            tests/flows/gp/test_tensor_higher_rank_runtime.py \
            tests/flows/gp/test_regression_utils_reuse.py \
            tests/trading_dsl_engine/cpp_stream/test_roll_rets.py::test_roll_rets_uses_monotonic_session_key \
            2>&1 | tee /tmp/gp-focused.log
          exit ${PIPESTATUS[0]}
      - name: Run GP compile fuzz
        id: fuzz
        shell: bash
        run: |
          set +e
          python -m pytest -q -s -o addopts="" tests/flows/gp/test_compile_fuzz.py 2>&1 | tee /tmp/gp-compile-fuzz.log
          status=${PIPESTATUS[0]}
          echo "pytest_status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Run deeper GP formulas
        shell: bash
        env:
          GP_FUZZ_MIN_DEPTH: "4"
          GP_FUZZ_MAX_DEPTH: "7"
          GP_IR_FUZZ_SAMPLES: "500"
          GP_NATIVE_FUZZ_SAMPLES: "6"
        run: |
          set +e
          python -m pytest -q -s -o addopts="" tests/flows/gp/test_compile_fuzz.py -k random_gp_formulas 2>&1 | tee /tmp/gp-deep-fuzz.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload GP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-compile-fuzz-and-signatures
          path: |
            /tmp/gp-focused.log
            /tmp/gp-compile-fuzz.log
            /tmp/gp-deep-fuzz.log
            /tmp/gp-signatures.txt
          if-no-files-found: warn

name: xs_gauss bounded validation

on:
  pull_request:
    branches: [agent/strongly-typed-gp]
    paths:
      - "src/trading_dsl_engine/cpp_stream/**"
      - "tests/trading_dsl_engine/cpp_stream/test_xs_gauss.py"
      - "scripts/benchmark_cpp_stream_xs_gauss.py"
      - "scripts/apply_xs_gauss_bounded.py"
      - ".github/workflows/xs-gauss-bounded-validation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply one-shot native edit
        run: |
          if [ ! -f scripts/apply_xs_gauss_bounded.py ]; then
            echo "bounded xs_gauss edit already applied"
            exit 0
          fi
          python scripts/apply_xs_gauss_bounded.py
          rm scripts/apply_xs_gauss_bounded.py
          rm -f scripts/xs_gauss_bounded_location.patch
          rm -f .github/workflows/apply-xs-gauss-bounded-patch.yml
          rm -f .github/workflows/apply-xs-gauss-bounded-patch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound xs_gauss location by RMS"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: xs-gauss-bounded-source-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .github
            src
            tests
            scripts
            pyproject.toml
            setup.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy numba pytest jinja2 jax equinox astropy
          includeigen pybind11 matplotlib graphviz
      - name: Run xs_gauss behavior tests
        env:
          PYTHONPATH: src
          CXX: g++
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_xs_gauss.py

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy numba jinja2 jax equinox astropy includeigen pybind11
      - name: Benchmark xs_gauss
        env:
          PYTHONPATH: src
          CXX: g++
          CPP_STREAM_XS_GAUSS_ROWS: "2000000"
          CPP_STREAM_XS_GAUSS_INSTRUMENTS: "9"
          CPP_STREAM_XS_GAUSS_RUNS: "7"
          CPP_STREAM_XS_GAUSS_WARMUPS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_xs_gauss.py

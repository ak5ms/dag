name: alpha search MCTS

on:
  push:
    branches:
      - agent/alpha-search-mcts-cpp-stream
    paths:
      - "src/flows/riskminer/**"
      - "tests/flows/test_riskminer.py"
      - "scripts/benchmark_riskminer_cpp_stream.py"
      - "docs/riskminer_cpp_stream.md"
      - ".github/workflows/alpha-search-mcts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run RiskMiner and native evaluator tests
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/flows/test_riskminer.py
      - name: Run reduced end-to-end search
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
          RISKMINER_ROWS: "1024"
          RISKMINER_INSTRUMENTS: "9"
          RISKMINER_SIMULATIONS: "16"
          RISKMINER_ROLLOUTS: "2"
          RISKMINER_SELECTION_BATCH: "4"
          RISKMINER_MAX_DEPTH: "8"
          RISKMINER_MAX_TOKENS: "16"
          RISKMINER_POOL_SIZE: "4"
          RISKMINER_WORK_DIR: ".riskminer-ci"
          RISKMINER_RESULT_JSON: ".riskminer-ci/result.json"
        run: |
          python scripts/benchmark_riskminer_cpp_stream.py
          cat .riskminer-ci/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riskminer-cpp-stream-results
          path: .riskminer-ci/
          if-no-files-found: ignore

# Contents API checkpoint: triggers the branch validation workflow.

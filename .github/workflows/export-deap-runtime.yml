name: Export DEAP runtime for local GP validation

on:
  push:
    branches:
      - agent/strongly-typed-gp
    paths:
      - ".github/workflows/export-deap-runtime.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and package DEAP
        shell: bash
        run: |
          python -m pip install deap
          python - <<'PY'
          import pathlib
          import deap
          root = pathlib.Path(deap.__file__).resolve().parent
          print(root)
          (pathlib.Path('/tmp/deap_path.txt')).write_text(str(root))
          PY
          root=$(cat /tmp/deap_path.txt)
          tar -C "$(dirname "$root")" -czf /tmp/deap-runtime.tar.gz "$(basename "$root")"
      - uses: actions/upload-artifact@v4
        with:
          name: deap-runtime
          path: /tmp/deap-runtime.tar.gz
          if-no-files-found: error
          retention-days: 1

name: Apply and benchmark GP Ridge search

on:
  push:
    branches:
      - agent/strongly-typed-gp
    paths:
      - ".github/workflows/gp-ridge-benchmark-run.yml"
      - "benchmarks/.gp-ridge-benchmark-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gp-ridge-benchmark-agent-strongly-typed-gp
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      TRADING_DSL_ENGINE_CPP_LTO: "0"
      TRADING_DSL_ENGINE_CPP_NATIVE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strongly-typed-gp
          fetch-depth: 0

      - name: Apply prepared GP script patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path(
              ".github/workflows/apply-gp-ridge-search-update.yml"
          )
          lines = workflow.read_text().splitlines()
          target = "- name: Patch the single GP search script"
          try:
              start = next(
                  index
                  for index, line in enumerate(lines)
                  if line.strip() == target
              )
          except StopIteration as exc:
              raise RuntimeError(
                  f"could not find {target!r} in {workflow}"
              ) from exc

          run_index = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip() == "run: |"
          )
          run_indent = len(lines[run_index]) - len(
              lines[run_index].lstrip()
          )
          block = []
          for line in lines[run_index + 1 :]:
              if line.strip():
                  indent = len(line) - len(line.lstrip())
                  if indent <= run_indent:
                      break
              block.append(line)

          script = textwrap.dedent("\n".join(block))
          if not script.startswith("python - <<'PY'"):
              raise RuntimeError(
                  "unexpected updater shell block: "
                  + script[:120]
              )
          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", script],
              check=True,
          )
          PY

      - name: Verify requested Ridge expression
        shell: bash
        run: |
          python -m py_compile scripts/run_gp_alpha_search.py
          python - <<'PY'
          from pathlib import Path

          text = Path("scripts/run_gp_alpha_search.py").read_text()
          required = {
              "normalized shifted alpha times volatility":
                  "ridge_alphas = [shift(alpha, 1, 1) * volatility for alpha in alphas]",
              "inverse half-spread-squared weights":
                  "ridge_weights = purify(1.0 / (hs * hs))",
              "nonnegative Ridge":
                  "nonneg=True",
              "per-row recomputation":
                  "POOL_RIDGE_RECOMPUTE_EVERY = 1",
              "exact volatility denominator":
                  "ewm_std(\n        clean_returns_expr(),\n        span=ALPHA_PNL_HL,",
          }
          missing = [
              label for label, snippet in required.items()
              if snippet not in text
          ]
          if missing:
              raise AssertionError(
                  "missing requested GP Ridge changes: "
                  + ", ".join(missing)
              )
          print("verified:", ", ".join(required))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Record runner information
        shell: bash
        run: |
          {
            echo "date_utc=$(date -u --iso-8601=seconds)"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "nproc=$(nproc)"
            echo
            lscpu
            echo
            free -h
            echo
            df -h
            echo
            g++ --version
            echo
            python --version
          } | tee /tmp/gp-runner-info.txt

      - name: Generate deterministic 5,000,000 x 9 float64 sources
        shell: bash
        run: |
          /usr/bin/time -v python - <<'PY' \
            2>&1 | tee /tmp/gp-data-generation.log
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import time

          import numpy as np

          from flows.riskminer.semantics import INPUTDATA_ALPHA_KEYS

          rows = 5_000_000
          n = 9
          chunk_rows = 100_000
          output = Path("/tmp/gp-alpha-search-data")
          output.mkdir(parents=True, exist_ok=True)
          rng = np.random.default_rng(42)
          started = time.perf_counter()

          def open_array(name):
              return np.lib.format.open_memmap(
                  output / f"_base_{name}.npy",
                  mode="w+",
                  dtype=np.float64,
                  shape=(rows, n),
                  fortran_order=False,
              )

          price = open_array("price")
          volume = open_array("volume")
          halfspread = open_array("halfspread")
          tradable = open_array("tradable")
          event_ts = open_array("event_ts")
          session_start = open_array("session_start")
          session_end = open_array("session_end")
          wdte = open_array("wdte")

          last_price = np.linspace(90.0, 110.0, n)
          epoch = 1_700_000_000_000_000.0
          minute_us = 60_000_000.0
          session_minutes = 1_440
          open_minutes = 1_380

          for start in range(0, rows, chunk_rows):
              stop = min(rows, start + chunk_rows)
              width = stop - start
              row_number = np.arange(start, stop, dtype=np.int64)
              minute = row_number % session_minutes
              day = row_number // session_minutes

              returns = np.clip(
                  rng.normal(0.0, 3.5e-4, size=(width, n)),
                  -0.02,
                  0.02,
              )
              log_prices = (
                  np.log(last_price)
                  + np.cumsum(returns, axis=0)
              )
              current_price = np.exp(log_prices)
              price[start:stop] = current_price
              last_price = current_price[-1]

              volume[start:stop] = rng.lognormal(
                  mean=7.0,
                  sigma=0.65,
                  size=(width, n),
              )
              halfspread[start:stop] = np.clip(
                  4.0e-4
                  + rng.normal(
                      0.0,
                      7.5e-5,
                      size=(width, n),
                  ),
                  5.0e-5,
                  2.0e-3,
              )

              open_row = minute < open_minutes
              tradable[start:stop] = open_row[:, None]

              current_ts = epoch + row_number * minute_us
              current_start = (
                  epoch
                  + day * session_minutes * minute_us
              )
              current_end = current_start + open_minutes * minute_us
              event_ts[start:stop] = current_ts[:, None]
              session_start[start:stop] = current_start[:, None]
              session_end[start:stop] = current_end[:, None]

              # Descend through five trading days and reset. Positive
              # differences at reset exercise the roll branch.
              current_wdte = 5.0 - (day % 5)
              wdte[start:stop] = current_wdte[:, None]

              if stop == rows or stop % 1_000_000 == 0:
                  print(
                      f"generated_rows={stop:,}/{rows:,}",
                      flush=True,
                  )

          bases = {
              "price": price,
              "volume": volume,
              "halfspread": halfspread,
              "tradable": tradable,
              "event_ts": event_ts,
              "session_start": session_start,
              "session_end": session_end,
              "wdte": wdte,
          }
          for array in bases.values():
              array.flush()
          del price, volume, halfspread, tradable
          del event_ts, session_start, session_end, wdte
          del bases

          def base_path(name):
              return output / f"_base_{name}.npy"

          def link(name, base):
              target = output / f"{name}.npy"
              target.unlink(missing_ok=True)
              os.link(base_path(base), target)

          for name in INPUTDATA_ALPHA_KEYS:
              if name == "_ev_ts":
                  base = "event_ts"
              elif name in {
                  "session_start0",
                  "next_session_start0",
              }:
                  base = "session_start"
              elif name in {
                  "session_end0",
                  "next_session_end0",
              }:
                  base = "session_end"
              elif name == "wdte_out0":
                  base = "wdte"
              elif name == "vw_halfspread_out0":
                  base = "halfspread"
              elif name == "is_tradable_out0":
                  base = "tradable"
              elif (
                  name.startswith("volume")
                  or name.startswith("trade_cross_pct")
              ):
                  base = "volume"
              else:
                  base = "price"
              link(name, base)

          # RollRets also uses the deferred contract and its tradability.
          link("mp_out1.close", "price")
          link("is_tradable_out1", "tradable")

          elapsed = time.perf_counter() - started
          payload = rows * n * 8
          manifest = {
              "rows": rows,
              "n_instruments": n,
              "dtype": "float64",
              "unique_base_arrays": 8,
              "bytes_per_base_array": payload,
              "unique_payload_bytes": payload * 8,
              "logical_source_count": (
                  len(INPUTDATA_ALPHA_KEYS) + 2
              ),
              "generation_seconds": elapsed,
          }
          (output / "manifest.json").write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True,
              )
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Smoke-test search and Ridge
        id: smoke
        env:
          GP_INPUT_GLOB: "/tmp/gp-alpha-search-data/*.npy"
          GP_OUTPUT_DIR: /tmp/gp-alpha-search-smoke
          GP_ROWS: "2000"
          GP_N_INSTRUMENTS: "9"
          GP_POPULATION_SIZE: "8"
          GP_GENERATIONS: "1"
          GP_ELITE_COUNT: "2"
          GP_IMMIGRANTS: "2"
          GP_POOL_SIZE: "4"
          GP_POOL_CANDIDATES_PER_GENERATION: "4"
          GP_FITNESS_SHARDS: "2"
          GP_THREADS: "1"
          GP_SHOW_PLOT: "0"
        shell: bash
        run: |
          set +e
          python scripts/run_gp_alpha_search.py \
            2>&1 | tee /tmp/gp-smoke.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit requested script changes
        if: steps.smoke.outputs.status == '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run_gp_alpha_search.py
          if git diff --cached --quiet; then
            echo "script already matches requested implementation"
          else
            git commit -m \
              "Use scaled nonnegative Ridge in GP search"
            git push origin HEAD:agent/strongly-typed-gp
          fi
          git rev-parse HEAD | tee /tmp/gp-script-commit.txt

      - name: Benchmark two full 5m x 9 generations
        id: full
        if: steps.smoke.outputs.status == '0'
        env:
          GP_INPUT_GLOB: "/tmp/gp-alpha-search-data/*.npy"
          GP_OUTPUT_DIR: /tmp/gp-alpha-search-5m
          GP_ROWS: "5000000"
          GP_N_INSTRUMENTS: "9"
          GP_POPULATION_SIZE: "64"
          GP_GENERATIONS: "2"
          GP_DEPTH_GROW_EVERY: "5"
          GP_ELITE_COUNT: "8"
          GP_IMMIGRANTS: "8"
          GP_POOL_SIZE: "16"
          GP_POOL_CANDIDATES_PER_GENERATION: "8"
          GP_FITNESS_SHARDS: "4"
          GP_THREADS: "1"
          GP_PARALLEL_DIAGNOSTIC: "1"
          GP_SHOW_PLOT: "0"
        shell: bash
        run: |
          set +e
          /usr/bin/time -v \
            python scripts/run_gp_alpha_search.py \
            2>&1 | tee /tmp/gp-alpha-search-5m.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run 50-generation convergence proxy
        id: proxy
        if: steps.smoke.outputs.status == '0' && steps.full.outputs.status == '0'
        env:
          GP_INPUT_GLOB: "/tmp/gp-alpha-search-data/*.npy"
          GP_OUTPUT_DIR: /tmp/gp-alpha-search-proxy
          GP_ROWS: "10000"
          GP_N_INSTRUMENTS: "9"
          GP_POPULATION_SIZE: "32"
          GP_GENERATIONS: "50"
          GP_DEPTH_GROW_EVERY: "5"
          GP_ELITE_COUNT: "8"
          GP_IMMIGRANTS: "8"
          GP_POOL_SIZE: "16"
          GP_POOL_CANDIDATES_PER_GENERATION: "8"
          GP_FITNESS_SHARDS: "4"
          GP_THREADS: "1"
          GP_PARALLEL_DIAGNOSTIC: "0"
          GP_SHOW_PLOT: "0"
        shell: bash
        run: |
          set +e
          /usr/bin/time -v \
            python scripts/run_gp_alpha_search.py \
            2>&1 | tee /tmp/gp-alpha-search-proxy.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assemble benchmark report
        if: always()
        env:
          SMOKE_STATUS: ${{ steps.smoke.outputs.status }}
          FULL_STATUS: ${{ steps.full.outputs.status }}
          PROXY_STATUS: ${{ steps.proxy.outputs.status }}
        shell: bash
        run: |
          report=/tmp/gp-alpha-search-report
          mkdir -p "$report/full_5m" "$report/convergence_proxy"
          cp /tmp/gp-runner-info.txt "$report/" || true
          cp /tmp/gp-data-generation.log "$report/" || true
          cp /tmp/gp-smoke.log "$report/" || true
          cp /tmp/gp-alpha-search-5m.log "$report/" || true
          cp /tmp/gp-alpha-search-proxy.log "$report/" || true
          cp /tmp/gp-script-commit.txt "$report/" || true
          cp /tmp/gp-alpha-search-data/manifest.json \
            "$report/data_manifest.json" || true

          for file in \
            gp_search_history.csv \
            gp_search_history.png \
            gp_search_benchmark.json
          do
            cp "/tmp/gp-alpha-search-5m/$file" \
              "$report/full_5m/" || true
            cp "/tmp/gp-alpha-search-proxy/$file" \
              "$report/convergence_proxy/" || true
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "workflow_sha": os.environ["GITHUB_SHA"],
              "smoke_status": os.environ.get("SMOKE_STATUS", ""),
              "full_status": os.environ.get("FULL_STATUS", ""),
              "proxy_status": os.environ.get("PROXY_STATUS", ""),
          }
          commit_path = Path("/tmp/gp-script-commit.txt")
          if commit_path.exists():
              report["script_commit"] = (
                  commit_path.read_text().strip()
              )
          for label, path in {
              "full_5m": Path(
                  "/tmp/gp-alpha-search-5m/"
                  "gp_search_benchmark.json"
              ),
              "convergence_proxy": Path(
                  "/tmp/gp-alpha-search-proxy/"
                  "gp_search_benchmark.json"
              ),
          }.items():
              if path.exists():
                  report[label] = json.loads(path.read_text())

          output = Path(
              "/tmp/gp-alpha-search-report/"
              "combined_benchmark_report.json"
          )
          output.write_text(
              json.dumps(
                  report,
                  indent=2,
                  sort_keys=True,
              )
          )
          print(output.read_text())
          PY

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-ridge-search-benchmark-${{ github.sha }}
          path: /tmp/gp-alpha-search-report
          if-no-files-found: error
          retention-days: 14

      - name: Fail on benchmark error
        if: always()
        shell: bash
        run: |
          smoke="${{ steps.smoke.outputs.status }}"
          full="${{ steps.full.outputs.status }}"
          proxy="${{ steps.proxy.outputs.status }}"
          if [[ "$smoke" != "0" ]]; then
            echo "smoke test failed with status $smoke"
            exit 1
          fi
          if [[ "$full" != "0" ]]; then
            echo "5m benchmark failed with status $full"
            exit 1
          fi
          if [[ "$proxy" != "0" ]]; then
            echo "proxy benchmark failed with status $proxy"
            exit 1
          fi

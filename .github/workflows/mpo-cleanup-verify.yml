name: MPO cleanup verification

on:
  push:
    branches: [agent/mpo-cleanup-verify]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mpo-postsolve-values-session-gate-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reapply lazy optimizer guard on target frontend and refresh docs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/strongly-typed-gp
          git checkout origin/agent/strongly-typed-gp -- src/trading_dsl_engine/ir/frontend.py
          python - <<'PY'
          from pathlib import Path

          frontend = Path("src/trading_dsl_engine/ir/frontend.py")
          text = frontend.read_text()
          anchor = '''    def _build_call(self, node: Call) -> int:\n        if node.fn in _NARY_ARITY:\n'''
          guard = '''    def _build_call(self, node: Call) -> int:\n        # A scalar `where(open, optimizer_field, NaN)` is a control-flow\n        # guard for the generated optimizer, not an eager elementwise mask.\n        # Encode the guard as a second projection child so cpp_stream can\n        # skip parameter loading, solving, and feedback-state advancement.\n        if (\n            node.fn == "where"\n            and not node.kwargs\n            and len(node.args) == 3\n            and isinstance(node.args[1], CvxpyFieldExpr)\n            and isinstance(node.args[2], Number)\n            and isinstance(node.args[2].value, float)\n            and math.isnan(node.args[2].value)\n        ):\n            condition = self.build(node.args[0])\n            condition_type = self.nodes[condition].value_type\n            try:\n                condition_shape = condition_type.logical_shape\n            except ValueError:\n                condition_shape = None\n            if condition_shape == ():\n                projection = node.args[1]\n                child = self.build(projection.program_expr)\n                child_op = self.nodes[child].op\n                if not isinstance(child_op, CvxpyProgramOp):\n                    raise FormulaIRCompileError(\n                        "optimizer field projection lost its generated "\n                        "program object"\n                    )\n                field = child_op.program.resolve_field(projection.field)\n                return self._append(\n                    CvxpyProjectionOp(field),\n                    (child, condition),\n                    _generated_field_value_type(\n                        child_op.program, field.logical_shape\n                    ),\n                )\n        if node.fn in _NARY_ARITY:\n'''
          if anchor not in text:
              raise SystemExit("frontend guard anchor not found")
          frontend.write_text(text.replace(anchor, guard, 1))

          docs = Path("docs/cvxpy_program_cpp_stream.md")
          text = docs.read_text()
          old = '''Constraint-value projections add a requested-only auxiliary primal to the\nsub-program. Merely requesting a dual or solver diagnostic does not change the\noptimization problem.\n'''
          new = '''Constraint-value projections are evaluated after the original Clarabel solve\nfrom the solved cone/slack state. Requesting `.value` therefore does not add an\nauxiliary primal or equality to the optimization problem; dual and info\nprojections likewise leave the cone program unchanged.\n'''
          if old not in text:
              raise SystemExit("constraint-value docs anchor not found")
          text = text.replace(old, new, 1)
          old = '''The same MPO can be reused in another outer formula without regenerating its\nnative parameter maps. A requested constraint value gets a distinct entry only\nbecause it changes the generated problem by adding the auxiliary projection\nvariable.\n'''
          new = '''The same MPO can be reused in another outer formula without regenerating its\nnative parameter maps. Constraint-value requests are projection metadata and do\nnot create a distinct optimization problem or solver artifact.\n'''
          if old not in text:
              raise SystemExit("cache docs anchor not found")
          text = text.replace(old, new, 1)
          anchor = '''`sequential=False` cannot override a real dependency elsewhere in the DAG. For\nexample, an MPO fed by stateful Ridge/EWM nodes still runs in temporal order.\nAn entirely independent DAG is row-parallel and gives each native worker its\nown persistent generated object and Clarabel solver.\n'''
          addition = anchor + '''\nFixed Clarabel settings can be supplied with `solver_settings={...}` on\n`@cvxpy_program`. They are validated during generation, included in the solver\nartifact cache key, and do not change the problem-factory interface. For example,\n`{"iterative_refinement_enable": False}` disables KKT iterative refinement for\na program whose numerical behavior has been validated without changing the\nglobal Clarabel default.\n\nA scalar `where(condition, get_field(program, ...), NaN)` can act as a lazy\nexecution guard when all projections from that program use the same condition.\nOn a false row cpp_stream skips parameter loading, the Clarabel solve, and\n`previous_solution()` state advancement, while emitting NaN for the guarded\noutputs. Other `where` expressions retain normal eager elementwise semantics.\n'''
          if anchor not in text:
              raise SystemExit("sequential docs anchor not found")
          docs.write_text(text.replace(anchor, addition, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trading_dsl_engine/ir/frontend.py docs/cvxpy_program_cpp_stream.md
          git commit -m "Rebase MPO guard onto strongly typed GP frontend"
          git push origin HEAD:agent/mpo-postsolve-values-session-gate-clean
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]'
      - name: Run focused native optimizer tests
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_clarabel_native_builder.py
          tests/trading_dsl_engine/cpp_stream/test_cvxpy_constraint_values_and_guard.py
          tests/trading_dsl_engine/cpp_stream/test_cvxpy_program_native.py
      - name: Run cpp_stream suite
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: python -m pytest -q -o addopts="" tests/trading_dsl_engine/cpp_stream
      - name: Run GP compile/runtime smoke
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/flows/gp/test_compile_fuzz.py
          tests/flows/gp/test_tensor_runtime.py

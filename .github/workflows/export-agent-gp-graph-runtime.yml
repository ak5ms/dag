name: Export agent GP graph runtime workspace

on:
  pull_request:
    branches:
      - agent/strongly-typed-gp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Fetch refs and bundle repository
        shell: bash
        run: |
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create /tmp/dag-agent-workspace.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: dag-agent-workspace-${{ github.sha }}
          path: /tmp/dag-agent-workspace.bundle
          if-no-files-found: error
          retention-days: 1

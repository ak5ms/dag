name: cpp_stream backend

on:
  pull_request:
    branches: [main]
    paths:
      - "src/trading_dsl_engine/base/keys.py"
      - "src/trading_dsl_engine/ir/**"
      - "src/trading_dsl_engine/cpp_stream/**"
      - "tests/trading_dsl_engine/cpp_stream/**"
      - ".github/workflows/cpp-stream-backend.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy pytest jinja2
      - name: Run IR, codegen, and typed mmap tests
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q -n 0
          tests/trading_dsl_engine/cpp_stream/test_codegen.py
          tests/trading_dsl_engine/cpp_stream/test_npy_inputs.py

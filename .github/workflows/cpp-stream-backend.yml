name: cpp_stream backend

on:
  pull_request:
    branches: [main]
    paths:
      - "src/trading_dsl_engine/base/custom.py"
      - "src/trading_dsl_engine/base/keys.py"
      - "src/trading_dsl_engine/ir/**"
      - "src/trading_dsl_engine/cpp_stream/**"
      - "src/flows/pov.py"
      - "src/flows/riskmodel.py"
      - "src/flows/riskminer/**"
      - "tests/flows/test_riskminer.py"
      - "tests/trading_dsl_engine/ir/test_einsum_ir.py"
      - "tests/trading_dsl_engine/cpp_stream/**"
      - "scripts/benchmark_cpp_stream*.py"
      - "scripts/benchmark_riskminer_cpp_stream.py"
      - ".github/workflows/cpp-stream-backend.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy numba pytest jinja2 jax equinox astropy
          includeigen pybind11 matplotlib graphviz
      - name: Run IR, source, native operator, and roll_rets tests
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/ir/test_einsum_ir.py
          tests/trading_dsl_engine/cpp_stream/test_codegen.py
          tests/trading_dsl_engine/cpp_stream/test_sources.py
          tests/trading_dsl_engine/cpp_stream/test_npy_inputs.py
          tests/trading_dsl_engine/cpp_stream/test_cpp_stream.py
          tests/trading_dsl_engine/cpp_stream/test_jax_flat_nan_compat.py
          tests/trading_dsl_engine/cpp_stream/test_minute_groupby.py
          tests/trading_dsl_engine/cpp_stream/test_cat_ridge.py
          tests/trading_dsl_engine/cpp_stream/test_einsum.py
          tests/trading_dsl_engine/cpp_stream/test_reductions.py
          tests/trading_dsl_engine/cpp_stream/test_roll_rets.py
      - name: Inspect optimized stateless assembly
        env:
          PYTHONPATH: src
        run: python scripts/audit_cpp_stream_stateless_codegen.py
      - name: Compare unhinted and typed hinted minute keys
        env:
          PYTHONPATH: src
          CPP_STREAM_BENCH_ROWS: "1000000"
          CPP_STREAM_BENCH_RUNS: "5"
          CPP_STREAM_BENCH_WARMUPS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: |
          CPP_STREAM_BENCH_CASE=minute_groupby python scripts/benchmark_cpp_stream.py
          CPP_STREAM_BENCH_CASE=minute_groupby_npy python scripts/benchmark_cpp_stream.py
      - name: Smoke benchmark cat and Ridge
        env:
          PYTHONPATH: src
          CPP_STREAM_RIDGE_ROWS: "500000"
          CPP_STREAM_RIDGE_RUNS: "5"
          CPP_STREAM_RIDGE_WARMUPS: "1"
          CPP_STREAM_RIDGE_CASE: all
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_ridge.py
      - name: Smoke benchmark generic einsum
        env:
          PYTHONPATH: src
          CPP_STREAM_EINSUM_ROWS: "250000"
          CPP_STREAM_EINSUM_INSTRUMENTS: "9"
          CPP_STREAM_EINSUM_RUNS: "3"
          CPP_STREAM_EINSUM_WARMUPS: "1"
          CPP_STREAM_EINSUM_CASE: all
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_einsum.py
      - name: Smoke benchmark streaming reductions
        env:
          PYTHONPATH: src
          CPP_STREAM_REDUCTION_ROWS: "500000"
          CPP_STREAM_REDUCTION_INSTRUMENTS: "9"
          CPP_STREAM_REDUCTION_RUNS: "3"
          CPP_STREAM_REDUCTION_WARMUPS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_reductions.py
      - name: Smoke benchmark riskmodel roll_rets
        env:
          PYTHONPATH: src
          CPP_STREAM_ROLL_ROWS: "250000"
          CPP_STREAM_ROLL_INSTRUMENTS: "9"
          CPP_STREAM_ROLL_RUNS: "3"
          CPP_STREAM_ROLL_WARMUPS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_roll_rets.py

  riskminer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run focused RiskMiner tests
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/flows/test_riskminer.py
      - name: Run reduced RiskMiner benchmark
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
          RISKMINER_ROWS: "1024"
          RISKMINER_INSTRUMENTS: "9"
          RISKMINER_SIMULATIONS: "16"
          RISKMINER_ROLLOUTS: "2"
          RISKMINER_SELECTION_BATCH: "4"
          RISKMINER_MAX_DEPTH: "8"
          RISKMINER_MAX_TOKENS: "16"
          RISKMINER_POOL_SIZE: "4"
          RISKMINER_WORK_DIR: ".riskminer-ci"
          RISKMINER_RESULT_JSON: ".riskminer-ci/result.json"
        run: |
          python scripts/benchmark_riskminer_cpp_stream.py
          cat .riskminer-ci/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riskminer-cpp-stream-results
          path: .riskminer-ci/
          if-no-files-found: ignore

name: MPO parts profile

on:
  push:
    branches: [agent/mpo-inputdata-example]

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]' graphviz
      - name: Profile MPO components
        env:
          PYTHONPATH: src:.
          MPLBACKEND: Agg
          MPO_PROFILE_ROWS: "5000"
          MPO_PROFILE_RUNS: "5"
        run: python scripts/profile_cpp_stream_mpo_parts.py

name: RiskMiner policy memory fix
on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - .github/workflows/riskminer-policy-memory-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/riskminer-cpp-stream-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest 'jax[cpu]'
      - name: Apply pool admission patch
        run: python scripts/.riskminer_pool_admission_fix.py
      - name: RiskMiner tests
        run: PYTHONPATH=src python -m pytest -q -o addopts='' tests/flows/riskminer/test_core.py tests/flows/riskminer/test_policy.py tests/flows/riskminer/test_paper_pipeline.py
      - name: Commit fix
        run: |
          git config user.name openai-agent
          git config user.email openai-agent@users.noreply.github.com
          git add src/flows/riskminer/pool.py tests/flows/riskminer/test_paper_pipeline.py
          git commit -m 'Require positive first RiskMiner pool improvement'
          git push origin HEAD:agent/riskminer-cpp-stream-v1

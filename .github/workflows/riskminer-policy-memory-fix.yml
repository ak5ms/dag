name: RiskMiner policy memory fix
on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - .github/workflows/riskminer-policy-memory-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/riskminer-cpp-stream-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest 'jax[cpu]' psutil
      - name: Apply patch
        run: python scripts/.riskminer_policy_fix.py
      - name: Unit tests
        run: PYTHONPATH=src python -m pytest -q -o addopts='' tests/flows/riskminer/test_core.py tests/flows/riskminer/test_policy.py
      - name: Policy inference smoke
        run: |
          PYTHONPATH=src python - <<'PY'
          import time
          import numpy as np
          from flows.riskminer.learned_policy import GRUPolicyConfig, JaxGRUPolicy, _policy_logits_numpy, policy_logits
          cfg = GRUPolicyConfig(vocabulary_size=132, max_sequence_length=30)
          policy = JaxGRUPolicy.initialize(cfg, token_priors=np.ones(132))
          rng = np.random.default_rng(7)
          tokens = tuple(int(x) for x in rng.integers(0, 132, size=30))
          for n in (0, 1, 5, 17, 30):
              expected = np.asarray(policy_logits(policy.params, cfg, tokens[:n]))
              actual = np.asarray(_policy_logits_numpy(policy.params, cfg, tokens[:n]))
              np.testing.assert_allclose(expected, actual, rtol=2e-6, atol=2e-6)
          started = time.perf_counter()
          checksum = 0.0
          for _ in range(1000):
              n = int(rng.integers(0, 31))
              checksum += float(_policy_logits_numpy(policy.params, cfg, tokens[:n])[0])
          elapsed = time.perf_counter() - started
          print({'1000_calls_seconds': elapsed, 'checksum': checksum})
          assert elapsed < 10.0
          PY
      - name: Commit fix
        run: |
          git config user.name openai-agent
          git config user.email openai-agent@users.noreply.github.com
          git add src/flows/riskminer/learned_policy.py src/flows/riskminer/trainer.py
          git commit -m 'Fix RiskMiner GRU inference memory growth'
          git push origin HEAD:agent/riskminer-cpp-stream-v1

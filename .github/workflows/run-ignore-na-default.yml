name: run cpp_stream reduction ignore_na update

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/run-ignore-na-default.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpp-stream-backend
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply staged transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path(
              '.github/workflows/apply-ignore-na-default.yml'
          ).read_text().splitlines()
          marker = '      - name: Apply API and native changes'
          start = lines.index(marker)
          run_line = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index] == '        run: |'
          )
          end = next(
              (
                  index
                  for index in range(run_line + 1, len(lines))
                  if lines[index].startswith('      - name: ')
              ),
              len(lines),
          )
          prefix = '          '
          script_lines = []
          in_triple = False
          for line in lines[run_line + 1:end]:
              rendered = (
                  line
                  if in_triple
                  else line[len(prefix):]
                  if line.startswith(prefix)
                  else line
              )
              script_lines.append(rendered)
              if rendered.count("'''") % 2:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit('unterminated staged multiline literal')
          script = '\n'.join(script_lines) + '\n'
          subprocess.run(
              ['bash', '-c', 'set -euo pipefail\n' + script], check=True
          )
          PY
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy numba pytest jinja2 includeigen
      - name: Run reduction tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q -o addopts="" tests/trading_dsl_engine/cpp_stream/test_reductions.py
      - name: Commit backend change
        run: |
          rm .github/workflows/apply-ignore-na-default.yml
          rm .github/workflows/run-ignore-na-default.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Default streaming reductions to ignore_na"
          git push origin HEAD:cpp-stream-backend

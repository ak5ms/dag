name: audit cpp_stream stateless codegen

on:
  pull_request:
    branches: [cpp-stream-backend]
    paths: [.github/workflows/audit-cpp-stream-stateless.yml]

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpp-stream-stateless-nan-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy numba pytest jinja2 jax equinox astropy
          includeigen pybind11 matplotlib graphviz
      - name: Run NaN compatibility and codegen tests
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_jax_flat_nan_compat.py
          tests/trading_dsl_engine/cpp_stream/test_codegen.py
      - name: Inspect optimized stateless assembly
        env:
          PYTHONPATH: src
        run: python scripts/audit_cpp_stream_stateless_codegen.py

name: MPO Clarabel speed spike

on:
  push:
    branches: [agent/mpo-clarabel-speed-spike]

jobs:
  speed-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]' graphviz
      - name: Run Clarabel speed variants
        env:
          PYTHONPATH: src:.
          MPLBACKEND: Agg
          MPO_SPEED_ROWS: "5000"
          MPO_SPEED_RUNS: "5"
        run: python scripts/spike_mpo_clarabel_speed.py

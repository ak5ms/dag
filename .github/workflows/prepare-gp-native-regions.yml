name: Prepare native GP region documentation

on:
  push:
    branches:
      - agent/strongly-typed-gp-native-regions

permissions:
  contents: write

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add scheduler documentation and remove bootstrap workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          additions = {
              Path("README.md"): r'''

          <!-- native-gp-region-scheduler -->
          ## Native GP region scheduling

          Strongly typed GP fitness evaluation compiles related candidates into bounded multi-output `cpp_stream` programs, preserving CSE within each batch. Independent batches are then submitted through `run_many(...)`, which owns one native C++ worker pool. Each inner runtime is single-threaded, preventing nested pools and oversubscription while allowing independent final-reduction DAGs to saturate available cores.

          `GP_FITNESS_BATCH_SIZE` bounds translation-unit size, `GP_FITNESS_TASKS_PER_WORKER` controls task granularity, `GP_NATIVE_WORKERS=0` uses the available CPU affinity, and `GP_PIN_NATIVE_WORKERS=1` enables worker pinning. The hot search loop does not create Python worker threads.

          Run the deterministic random-formula benchmark with:

          ```bash
          python scripts/benchmark_gp_native_scheduler.py
          ```

          The benchmark compiles random strongly typed GP formulas once, compares serial execution, the former Python thread-pool orchestration, and native scheduling, verifies identical fitness outputs, and reports effective busy-core utilization.
          ''',
              Path("AGENTS.md"): r'''

          <!-- native-gp-region-scheduler -->
          ## Native GP scheduler invariants

          - Evaluate independent GP fitness batches with `trading_dsl_engine.cpp_stream.run_many`; do not reintroduce a Python `ThreadPoolExecutor` in the search hot path.
          - Keep each native batch bounded and cost-balanced. Preserve CSE by compiling related candidate outputs together, but do not emit one unbounded translation unit for a full population or one translation unit per candidate on high-core hosts.
          - The outer native scheduler owns CPU parallelism. Use one thread per final-reduction runtime unless the planner proves a profitable inner partition, and never create nested native/Eigen/OpenMP worker pools.
          - Preserve serial equivalence for every batched result, output ordering, NaN mask, and walk-forward fold. Scheduler diagnostics and benchmark timing must stay outside row hot loops.
          - Use `scripts/benchmark_gp_native_scheduler.py` after changing GP batching, multi-output lowering, `run_many`, CPU affinity, or final-reduction execution.
          ''',
              Path("src/trading_dsl_engine/cpp_stream/PARALLELISM.md"): r'''

          <!-- native-gp-region-scheduler -->
          ## Independent runtime regions

          `run_many(runtimes, ...)` is the native scheduling boundary for independent compiled DAG regions. It prepares all source pointers and outputs once, then submits tasks to one C++ worker pool. The pool uses an atomic task index for load balancing, optionally pins workers, and invokes each generated runner through its stable C ABI. Python performs orchestration and result construction only; it does not own worker threads during execution.

          This path is particularly important for GP fitness graphs whose temporal reductions make each individual runtime sequential. The search groups related candidates into bounded multi-output programs for CSE, estimates formula cost, balances those programs across native tasks, and runs each task with one inner thread. This provides population-level parallelism without oversubscribing the machine.

          `run_many` is component scheduling, not a claim that arbitrary temporal/cross-sectional boundaries inside one runtime are cache-tiled. Whole-plan row/lane scheduling remains the intra-runtime mechanism; independent-root scheduling covers the GP workload where graph-level dependencies otherwise force a serial final accumulator.
          ''',
          }

          for path, text in additions.items():
              current = path.read_text(encoding="utf-8")
              if "<!-- native-gp-region-scheduler -->" not in current:
                  path.write_text(current.rstrip() + text + "\n", encoding="utf-8")
          PY
          git rm .github/workflows/prepare-gp-native-regions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md src/trading_dsl_engine/cpp_stream/PARALLELISM.md
          git commit -m "docs: document native GP region scheduling"
          git push origin "HEAD:${GITHUB_REF_NAME}"

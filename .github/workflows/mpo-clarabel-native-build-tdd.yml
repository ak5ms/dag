name: MPO Clarabel native-build TDD

on:
  push:
    branches: [agent/mpo-clarabel-native-build]
    paths:
      - .github/workflows/mpo-clarabel-native-build-tdd.yml
      - src/trading_dsl_engine/cpp_stream/optimizer/clarabel_native.py
      - tests/trading_dsl_engine/cpp_stream/test_clarabel_native_builder.py

concurrency:
  group: mpo-clarabel-native-build-tdd
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install pytest pytest-xdist Jinja2
      - name: Run focused builder test
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q -n 0
          tests/trading_dsl_engine/cpp_stream/test_clarabel_native_builder.py

  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optimizer dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e '.[optimizer]'
      - name: Build host-native Clarabel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from trading_dsl_engine.cpp_stream.optimizer import build_current_clarabel

          cache = Path(os.environ["RUNNER_TEMP"]) / "clarabel-native"
          paths = build_current_clarabel(cache_dir=cache)
          marker = cache / "native" / "BUILD_ID"
          text = marker.read_text()
          assert "RUSTFLAGS=-C target-cpu=native" in text, text
          with Path(os.environ["GITHUB_ENV"]).open("a") as handle:
              handle.write(f"CLARABEL_INCLUDE_DIR={paths.include_dir}\n")
              handle.write(f"CLARABEL_STATIC_LIBRARY={paths.static_library}\n")
          print(text, end="")
          PY
      - name: Test generated native optimizer integration
        env:
          TRADING_DSL_ENGINE_CPP_STREAM_CACHE: ${{ runner.temp }}/cpp-stream-cache
        run: >-
          python -m pytest -q -n 0
          tests/trading_dsl_engine/cpp_stream/test_cvxpy_program_native.py

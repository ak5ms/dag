name: Remove obsolete RiskMiner branches

on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - ".github/workflows/riskminer-policy-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete only explicitly obsolete RiskMiner branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "agent/alpha-search-mcts-pre-riskminer"
            "agent/riskminer-cpp-stream-v1-pre-rebase-20260807"
            "agent/riskminer-feature-export-20260807"
            "agent/riskminer-latest-base-export-20260807"
            "agent/riskminer-rebase-25db460"
            "agent/riskminer-rebase-61ee0c"
            "agent/riskminer-rebase-apply-20260807"
            "agent/riskminer-sandbox-export-20260807"
          )
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|agent/cpp-stream-operators|agent/riskminer-cpp-stream-v1)
                echo "Refusing protected branch: $branch" >&2
                exit 2
                ;;
            esac
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting obsolete branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

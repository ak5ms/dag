name: local dependencies

on:
  push:
    branches:
      - agent/strongly-typed-gp-speedups
    paths:
      - ".github/workflows/local-dependencies.yml"

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip download --dest wheels pybind11 includeigen deap equinox
      - uses: actions/upload-artifact@v4
        with:
          name: local-dependency-wheels
          path: wheels

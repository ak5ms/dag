name: Apply Ridge width fix

on:
  push:
    branches: [agent/strongly-typed-gp-tensor-work]
    paths: [.github/workflows/gp-fix-ridge-width.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix flattened Ridge feature width
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/ridge.hpp')
          text = path.read_text()
          old = 'static constexpr std::size_t K = sizeof...(FeatureSources);'
          new = 'static constexpr std::size_t K = FeatureList<FeatureSources...>::width;'
          if old not in text:
              raise SystemExit('expected Ridge width declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trading_dsl_engine/cpp_stream/cpp/stackdsl/ops/ridge.hpp
          git commit -m 'Size Ridge by flattened feature width'
          git push

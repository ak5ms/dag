name: RiskMiner granular logging validation
on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - .github/workflows/riskminer-granular-logging.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/riskminer-cpp-stream-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest 'jax[cpu]'
      - name: Apply granular logging patch
        run: python scripts/.riskminer_granular_logging_patch.py
      - name: Focused RiskMiner tests
        run: PYTHONPATH=src python -m pytest -q -o addopts='' tests/flows/riskminer/test_core.py tests/flows/riskminer/test_policy.py tests/flows/riskminer/test_paper_pipeline.py
      - name: Trace smoke
        run: |
          PYTHONPATH=src python - <<'PY'
          from flows.riskminer.config import RiskMinerConfig
          from flows.riskminer.mcts import RewardDenseRiskMCTS, SchemaPriorPolicy
          from flows.riskminer.rpn import TypedRPNEnvironment, build_vocabulary
          from flows.riskminer.semantics import SearchShape, SemanticInfo
          from types import SimpleNamespace

          config = RiskMinerConfig(
              max_depth=2, min_formula_depth=2, max_tokens=6, max_stack=3,
              simulations=2, rollouts_per_expansion=1, evaluation_batch_size=1,
              archive_size=8, seed=9,
          )
          sem = SemanticInfo(frozenset({'numeric', 'dimensionless'}), SearchShape.ROW)
          vocabulary = build_vocabulary(terminals={'x': sem, 'y': sem}, literals=(1.0,))
          environment = TypedRPNEnvironment(config=config, vocabulary=vocabulary)
          events = []
          class Reward:
              def intermediate_rewards(self, values):
                  return {value.canonical_key: 0.25 for value in values}
              def terminal_reward(self, value, *, rpn, individual_score=float('nan')):
                  return SimpleNamespace(
                      reward=0.5,
                      transition=SimpleNamespace(
                          committed=False, previous_score=0.4, resulting_score=0.5,
                          additive_delta=0.1, pool_size=1, evicted=None,
                      ),
                  )
          result = RewardDenseRiskMCTS(
              environment, Reward(), config=config, policy=SchemaPriorPolicy(),
              on_event=lambda name, payload: events.append((name, payload)),
          ).search()
          names = {name for name, _ in events}
          assert 'mcts_node_choice' in names
          assert 'mcts_rollout_choice' in names
          assert 'mcts_candidates_evaluate' in names
          assert 'mcts_candidates_scored' in names
          assert 'mcts_backprop_edge' in names
          print({'events': len(events), 'event_names': sorted(names), 'trajectories': result.metrics.trajectories})
          PY
      - name: Commit implementation
        run: |
          git config user.name openai-agent
          git config user.email openai-agent@users.noreply.github.com
          git add src/flows/riskminer/mcts.py src/flows/riskminer/trainer.py scripts/run_riskminer_inputdata.py tests/flows/riskminer/test_paper_pipeline.py
          git commit -m 'Add granular RiskMiner MCTS tracing'
          git push origin HEAD:agent/riskminer-cpp-stream-v1

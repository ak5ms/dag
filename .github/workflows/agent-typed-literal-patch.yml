name: agent typed literal patch

on:
  push:
    branches:
      - "agent/multi-formula-cpp-stream"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-formula-cpp-stream
          fetch-depth: 0

      - name: Preserve integer and float literal types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re


          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected one match in {path}, found {count}: {old[:80]!r}"
                  )
              file.write_text(text.replace(old, new, 1))


          parser = "src/trading_dsl_engine/base/parser.py"
          replace_once(
              parser,
              "class Number(Expr):\n    value: float",
              "class Number(Expr):\n    value: int | float",
          )
          replace_once(
              parser,
              """        if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)):
            return Number(float(node.value))
""",
              """        if isinstance(node, ast.Constant) and isinstance(
            node.value, (int, float)
        ):
            value = node.value
            return Number(float(value) if isinstance(value, bool) else value)
""",
          )
          replace_once(
              parser,
              """                    if isinstance(v, (int, float)):
                        return Number(-float(v))
""",
              """                    if isinstance(v, (int, float)):
                        return Number(
                            -float(v) if isinstance(v, bool) else -v
                        )
""",
          )

          dsl = "src/trading_dsl_engine/base/dsl.py"
          replace_once(
              dsl,
              """    if isinstance(value, (int, float)):
        return Number(float(value))
""",
              """    if isinstance(value, bool):
        return Number(float(value))
    if isinstance(value, int):
        return Number(value)
    if isinstance(value, float):
        return Number(value)
""",
          )
          replace_once(
              dsl,
              """    if isinstance(axis, (int, float)):
        return Number(float(axis))
""",
              """    if isinstance(axis, bool):
        return Number(float(axis))
    if isinstance(axis, int):
        return Number(axis)
    if isinstance(axis, float):
        return Number(axis)
""",
          )

          ir_frontend = "src/trading_dsl_engine/ir/frontend.py"
          file = Path(ir_frontend)
          text = file.read_text()
          pattern = re.compile(
              r"def _number_key\(value: float\) -> tuple:\n.*?\n\ndef _expr_key",
              re.DOTALL,
          )
          replacement = '''def _number_key(value: int | float) -> tuple:
    """Return a stable, type-preserving key for a numeric literal.

    Integer and floating literals are semantically distinct. Float values retain
    their IEEE encoding so NaNs share one key while signed zero remains distinct.
    """

    if isinstance(value, int) and not isinstance(value, bool):
        return ("int", value)
    numeric = float(value)
    if math.isnan(numeric):
        return ("nan",)
    return ("bits", struct.unpack("!Q", struct.pack("!d", numeric))[0])


def _expr_key'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"failed to replace _number_key in {ir_frontend}")
          old = """        if isinstance(node, Number):
            return self._append(LiteralOp(node.value), (), SCALAR)
"""
          new = """        if isinstance(node, Number):
            value_type = (
                tensor((), dtype="int64")
                if isinstance(node.value, int)
                and not isinstance(node.value, bool)
                else SCALAR
            )
            return self._append(LiteralOp(node.value), (), value_type)
"""
          if text.count(old) != 1:
              raise RuntimeError("failed to locate Number lowering in IR frontend")
          file.write_text(text.replace(old, new, 1))

          cpp_frontend = "src/trading_dsl_engine/cpp_stream/python/frontend.py"
          file = Path(cpp_frontend)
          text = file.read_text()
          text = text.replace("from dataclasses import replace\n", "", 1)
          text = text.replace("import math\n", "", 1)
          pattern = re.compile(
              r"\n_INT64_MIN = .*?\n\ndef _depends_on_temporal_reduction",
              re.DOTALL,
          )
          text, count = pattern.subn(
              "\n\ndef _depends_on_temporal_reduction", text, count=1
          )
          if count != 1:
              raise RuntimeError("failed to remove temporary literal restoration")
          call = "    _restore_native_literals(builder.nodes)\n"
          if text.count(call) != 1:
              raise RuntimeError("failed to locate temporary literal restoration call")
          file.write_text(text.replace(call, "", 1))

          tests = "tests/trading_dsl_engine/cpp_stream/test_output_projection.py"
          file = Path(tests)
          text = file.read_text()
          text = text.replace(
              "from trading_dsl_engine.cpp_stream import compile_formula\n",
              "from trading_dsl_engine.base.dsl import var\n"
              "from trading_dsl_engine.cpp_stream import compile_formula\n",
              1,
          )
          text = text.replace(
              "from trading_dsl_engine.ir.types import fixed\n",
              "from trading_dsl_engine.ir.ops import LiteralOp\n"
              "from trading_dsl_engine.ir.types import fixed, tensor\n",
              1,
          )
          marker = """    assert layout.row_lane_partitionable is False


"""
          addition = '''    assert layout.row_lane_partitionable is False


def test_integer_and_float_literals_remain_distinct_in_ir() -> None:
    program = compile_ir(
        ["x % 7", "x % 7.0", "x + 1", "x + 1.0"],
        input_value_types={"x": tensor((None,), dtype="int64")},
    )
    literals = [
        node for node in program.nodes if isinstance(node.op, LiteralOp)
    ]
    assert any(type(node.op.value) is int and node.op.value == 7 for node in literals)
    assert any(
        type(node.op.value) is float and node.op.value == 7.0
        for node in literals
    )
    assert any(type(node.op.value) is int and node.op.value == 1 for node in literals)
    assert any(
        type(node.op.value) is float and node.op.value == 1.0
        for node in literals
    )
    assert len(set(program.outputs)) == 4


def test_integer_and_float_literals_keep_native_semantics(
    tmp_path: Path,
) -> None:
    maximum = np.iinfo(np.int64).max
    x = np.array(
        [
            [maximum, maximum - 1, (1 << 60) + 1, (1 << 60) + 2],
            [(1 << 60) + 3, (1 << 60) + 4, (1 << 60) + 5, (1 << 60) + 6],
        ],
        dtype=np.int64,
    )

    runtime = compile_formula(
        [var("x") % 7, "x % 7.0", var("x") + 1.0],
        {"x": x},
        n_instruments=x.shape[1],
    )
    integer_mod, float_mod, float_add = runtime.run(
        out_path=tmp_path / "typed-literals.npy"
    ).load(mmap_mode=None)

    np.testing.assert_allclose(
        integer_mod,
        (x % 7).astype(np.float64),
        rtol=0.0,
        atol=0.0,
    )
    np.testing.assert_allclose(
        float_mod,
        np.fmod(x.astype(np.float64), 7.0),
        rtol=0.0,
        atol=0.0,
    )
    np.testing.assert_allclose(
        float_add,
        x.astype(np.float64) + 1.0,
        rtol=0.0,
        atol=0.0,
    )
    assert integer_mod[0, 0] >= 0.0
    assert float_add[0, 0] > 0.0


'''
          if text.count(marker) != 1:
              raise RuntimeError("failed to locate output projection test marker")
          file.write_text(text.replace(marker, addition, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/trading_dsl_engine/base/parser.py \
            src/trading_dsl_engine/base/dsl.py \
            src/trading_dsl_engine/ir/frontend.py \
            src/trading_dsl_engine/cpp_stream/python/frontend.py \
            tests/trading_dsl_engine/cpp_stream/test_output_projection.py
          git commit -m "cpp_stream: preserve integer and float literal types"
          git push origin HEAD:agent/multi-formula-cpp-stream

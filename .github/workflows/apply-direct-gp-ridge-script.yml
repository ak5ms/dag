name: Apply direct GP Ridge script

on:
  push:
    branches:
      - agent/strongly-typed-gp
    paths:
      - ".github/workflows/apply-direct-gp-ridge-script.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strongly-typed-gp
          fetch-depth: 0

      - name: Write validated files
        env:
          GP_SCRIPT_ZLIB_B64: ""
          GP_GENERATOR_ZLIB_B64: ""
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import py_compile
          import zlib

          files = [
              (
                  Path("scripts/run_gp_alpha_search.py"),
                  os.environ["GP_SCRIPT_ZLIB_B64"],
                  "652c20c35f17187e87654de9c6e80f5fca54218e6b663b7b8fa7b2a8930c02d9",
              ),
              (
                  Path("scripts/generate_gp_alpha_search_benchmark_data.py"),
                  os.environ["GP_GENERATOR_ZLIB_B64"],
                  "1d7a7b3ec7482d993d8826b8295b12e04d7dc350e4a8cfae34a0fa23e9f01c68",
              ),
          ]
          for path, encoded, expected_sha in files:
              content = zlib.decompress(base64.b64decode(encoded))
              actual_sha = hashlib.sha256(content).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(
                      f"payload checksum mismatch for {path}: "
                      f"{actual_sha} != {expected_sha}"
                  )
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              py_compile.compile(str(path), doraise=True)
              print(
                  f"wrote {path} bytes={len(content)} "
                  f"sha256={actual_sha}"
              )
          PY

      - name: Verify requested Ridge settings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("scripts/run_gp_alpha_search.py").read_text()
          required = {
              "shifted L1 alpha times volatility":
                  "shift(alpha, 1, 1) * volatility",
              "inverse half-spread-squared W":
                  "ridge_weights = purify(1.0 / (hs * hs))",
              "nonnegative Ridge":
                  "nonneg=True",
              "per-row recomputation":
                  "POOL_RIDGE_RECOMPUTE_EVERY = 1",
              "exact volatility denominator":
                  "span=ALPHA_PNL_HL",
          }
          missing = [
              label
              for label, snippet in required.items()
              if snippet not in text
          ]
          if missing:
              raise AssertionError(
                  "missing requested settings: "
                  + ", ".join(missing)
              )
          print("verified:", ", ".join(required))
          PY

      - name: Commit files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email             41898282+github-actions[bot]@users.noreply.github.com
          git add             scripts/run_gp_alpha_search.py             scripts/generate_gp_alpha_search_benchmark_data.py
          if git diff --cached --quiet; then
            echo "files already current"
          else
            git commit -m               "Use scaled nonnegative Ridge in GP search"
            git push origin HEAD:agent/strongly-typed-gp
          fi
          git rev-parse HEAD

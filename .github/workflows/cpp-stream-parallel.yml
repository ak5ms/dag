name: cpp_stream parallel

on:
  pull_request:
    branches: [cpp-stream-backend]
    paths:
      - "src/trading_dsl_engine/cpp_stream/**"
      - "tests/trading_dsl_engine/cpp_stream/test_parallel.py"
      - "tests/trading_dsl_engine/cpp_stream/test_cat_parallel.py"
      - "tests/trading_dsl_engine/cpp_stream/test_reductions.py"
      - "tests/trading_dsl_engine/cpp_stream/test_reductions_parallel.py"
      - "tests/trading_dsl_engine/cpp_stream/test_jax_flat_nan_compat.py"
      - "scripts/benchmark_cpp_stream_cat_parallel.py"
      - "scripts/benchmark_cpp_stream_reductions.py"
      - ".github/workflows/cpp-stream-parallel.yml"
  workflow_dispatch:

jobs:
  multicore-tests-and-cat-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify multicore runner
        run: |
          lscpu
          python - <<'PY'
          import os
          affinity = sorted(os.sched_getaffinity(0)) if hasattr(os, "sched_getaffinity") else list(range(os.cpu_count() or 1))
          print(f"os.cpu_count={os.cpu_count()}")
          print(f"affinity={affinity}")
          if len(affinity) < 2:
              raise SystemExit(f"parallel benchmark requires at least two available CPUs, found {len(affinity)}")
          PY
      - name: Install focused dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy numba pytest jinja2 jax equinox astropy
          includeigen pybind11 matplotlib graphviz
      - name: Run multicore and reduction correctness tests
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_jax_flat_nan_compat.py
          tests/trading_dsl_engine/cpp_stream/test_reductions.py
          tests/trading_dsl_engine/cpp_stream/test_reductions_parallel.py
          tests/trading_dsl_engine/cpp_stream/test_parallel.py
          tests/trading_dsl_engine/cpp_stream/test_cat_parallel.py
      - name: Benchmark streaming reductions
        env:
          PYTHONPATH: src
          CPP_STREAM_REDUCTION_ROWS: "5000000"
          CPP_STREAM_REDUCTION_INSTRUMENTS: "9"
          CPP_STREAM_REDUCTION_RUNS: "10"
          CPP_STREAM_REDUCTION_WARMUPS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_reductions.py
      - name: Benchmark Cat serial versus automatic multicore
        env:
          PYTHONPATH: src
          CPP_STREAM_CAT_ROWS: "5000000"
          CPP_STREAM_CAT_INSTRUMENTS: "9"
          CPP_STREAM_CAT_RUNS: "10"
          CPP_STREAM_CAT_WARMUPS: "1"
          CPP_STREAM_REQUIRE_MULTICORE: "1"
          CPP_STREAM_PIN_THREADS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_cat_parallel.py

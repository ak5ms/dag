name: Validate planned JAX-flat engine

on:
  push:
    branches:
      - optimize-jax-flat-compound-scan
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAX_ENABLE_X64: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run full JAX-flat tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -n 0 tests/trading_dsl_engine/jax_flat 2>&1 | tee pytest.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planned-engine-pytest-log
          path: pytest.log

name: Benchmark planned JAX-flat engine

on:
  push:
    branches:
      - optimize-jax-flat-compound-scan
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        group:
          - stateless
          - stateful
          - mixed
          - operators
          - blockers
          - memmap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAX_ENABLE_X64: "True"
      TRADING_DSL_ENGINE_DISABLE_CPP_ACCEL: "1"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      BENCH_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run ${{ matrix.group }} before-after matrix
        shell: bash
        run: python scripts/benchmark_runtime_matrix.py 2>&1 | tee "benchmark_${BENCH_GROUP}.log"
      - name: Upload ${{ matrix.group }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planned-engine-runtime-${{ matrix.group }}
          path: |
            benchmark_${{ matrix.group }}.csv
            benchmark_${{ matrix.group }}.json
            benchmark_${{ matrix.group }}.md
            benchmark_${{ matrix.group }}.log

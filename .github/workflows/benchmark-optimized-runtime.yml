name: Validate planned JAX-flat engine

on:
  push:
    branches:
      - optimize-jax-flat-compound-scan
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAX_ENABLE_X64: "True"
      TRADING_DSL_ENGINE_DISABLE_CPP_ACCEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run JAX-flat regression suite
        run: pytest -q -n 0 tests/trading_dsl_engine/jax_flat

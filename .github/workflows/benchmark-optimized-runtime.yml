name: Validate planned JAX-flat engine

on:
  push:
    branches:
      - optimize-jax-flat-compound-scan
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAX_ENABLE_X64: "True"
      TRADING_DSL_ENGINE_DISABLE_CPP_ACCEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run broad planned-engine suite
        shell: bash
        run: |
          set -o pipefail
          pytest -q -n 0 tests/trading_dsl_engine/jax_flat \
            --ignore=tests/trading_dsl_engine/jax_flat/test_metadata_units_ranges.py \
            --ignore=tests/trading_dsl_engine/jax_flat/test_codegen_fusion.py \
            --ignore=tests/trading_dsl_engine/jax_flat/test_cpp_flat_runtime.py \
            --ignore=tests/trading_dsl_engine/jax_flat/test_groupby_semantics_spec.py \
            2>&1 | tee pytest.log
      - name: Run isolated native smoke tests
        shell: bash
        run: |
          set -o pipefail
          for test in \
            test_cpp_flat_stateless_chain_matches_jax_flat \
            test_cpp_flat_stateful_cumsum_ewm_shift_ffill_matches_jax_flat \
            test_cpp_flat_groupby_nested_rhs_matches_jax_flat \
            test_cpp_hybrid_batch_can_stage_cpp_before_and_after_jax_lambda
          do
            TRADING_DSL_ENGINE_DISABLE_CPP_ACCEL=0 \
              pytest -q -n 0 "tests/trading_dsl_engine/jax_flat/test_cpp_flat_runtime.py::$test" \
              2>&1 | tee -a pytest.log
          done
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planned-engine-pytest-log
          path: pytest.log

name: Apply group vec fix
on:
  push:
    branches: [agent/strongly-typed-gp-tensor-work]
    paths: [.github/workflows/gp-fix-group-vec.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/flows/gp/generation.py')
          s=p.read_text()
          old='return _is_group_utility_family(family) or family in _GROUP_RHS_REDUCTION_FAMILIES'
          new='return _is_group_utility_family(family) or family in _GROUP_RHS_REDUCTION_FAMILIES or bool(family) and family.startswith("vec_")'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/flows/gp/generation.py
          git commit -m 'Reject vec reductions inside captured groups'
          git push

name: RiskMiner self-reporting checkpoint

on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - "src/flows/riskminer/**"
      - "scripts/benchmark_riskminer_cpp_stream.py"
      - "tests/flows/riskminer/**"
      - ".github/workflows/riskminer-self-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-benchmark-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run focused tests without losing the log
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/riskminer-report
          python -m pytest -q -o addopts="" \
            tests/flows/riskminer \
            tests/flows/test_alpha_search.py \
            > /tmp/riskminer-report/tests.log 2>&1
          status=$?
          echo "$status" > /tmp/riskminer-report/tests.status
          cat /tmp/riskminer-report/tests.log
          exit 0
      - name: Run reduced benchmark if tests passed
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
          RISKMINER_ROWS: "2000"
          RISKMINER_INSTRUMENTS: "9"
          RISKMINER_SIMULATIONS: "6"
          RISKMINER_ROLLOUTS: "2"
          RISKMINER_EVALUATION_BATCH: "3"
          RISKMINER_ARCHIVE_SIZE: "20"
          RISKMINER_POOL_SIZE: "3"
          RISKMINER_OUTPUT_DIR: "/tmp/riskminer-output"
        shell: bash
        run: |
          set +e
          if [ "$(cat /tmp/riskminer-report/tests.status)" = "0" ]; then
            python scripts/benchmark_riskminer_cpp_stream.py \
              > /tmp/riskminer-report/benchmark.log 2>&1
            status=$?
          else
            echo "benchmark skipped because focused tests failed" \
              > /tmp/riskminer-report/benchmark.log
            status=99
          fi
          echo "$status" > /tmp/riskminer-report/benchmark.status
          cat /tmp/riskminer-report/benchmark.log
          exit 0
      - name: Persist logs and machine-readable status to branch
        if: always()
        shell: bash
        run: |
          mkdir -p benchmarks/riskminer_checkpoint
          cp /tmp/riskminer-report/tests.log \
            benchmarks/riskminer_checkpoint/tests.log
          cp /tmp/riskminer-report/benchmark.log \
            benchmarks/riskminer_checkpoint/benchmark.log
          test_status=$(cat /tmp/riskminer-report/tests.status 2>/dev/null || echo 98)
          benchmark_status=$(cat /tmp/riskminer-report/benchmark.status 2>/dev/null || echo 98)
          cat > benchmarks/riskminer_checkpoint/status.json <<EOF
          {
            "source_sha": "${GITHUB_SHA}",
            "tests_exit_code": ${test_status},
            "benchmark_exit_code": ${benchmark_status},
            "runner_os": "${RUNNER_OS}",
            "python": "3.11"
          }
          EOF
          if [ -f /tmp/riskminer-output/riskminer_benchmark.json ]; then
            cp /tmp/riskminer-output/riskminer_benchmark.json \
              benchmarks/riskminer_checkpoint/riskminer_benchmark.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/riskminer_checkpoint
          if ! git diff --cached --quiet; then
            git commit -m "Record RiskMiner checkpoint test and benchmark output"
            git push origin HEAD:agent/riskminer-cpp-stream-v1
          fi
      - name: Fail workflow if validation failed
        if: always()
        shell: bash
        run: |
          test_status=$(cat /tmp/riskminer-report/tests.status 2>/dev/null || echo 98)
          benchmark_status=$(cat /tmp/riskminer-report/benchmark.status 2>/dev/null || echo 98)
          if [ "$test_status" != "0" ] || [ "$benchmark_status" != "0" ]; then
            exit 1
          fi

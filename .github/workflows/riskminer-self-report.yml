name: Finalize RiskMiner InputData runner

on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - ".github/workflows/riskminer-self-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Align runner with repository riskmodel defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/run_riskminer_inputdata.py")
          text = script.read_text()
          text = text.replace(
              'TARGET_POOL_SIZE = int(os.environ.get("RISKMINER_TARGET_POOL_SIZE", "12"))',
              'TARGET_POOL_SIZE = int(os.environ.get("RISKMINER_TARGET_POOL_SIZE", "6"))',
          )
          text = text.replace(
              '''    gap_time = shift(streak(isnan(roll_rets_gap)))\n    roll_rets_gap_scaled = roll_rets_gap / (gap_time / 1440) ** 0.5\n''',
              '',
          )
          text = text.replace(
              '        roll_rets_gap_scaled**2,',
              '        roll_rets_gap**2,',
          )
          if 'roll_rets_gap_scaled' in text:
              raise SystemExit("stale gap-scaled volatility reference remains")
          if 'RISKMINER_TARGET_POOL_SIZE", "6"' not in text:
              raise SystemExit("target-pool default was not updated")
          script.write_text(text)

          docs = Path("docs/riskminer_inputdata.md")
          docs_text = docs.read_text().replace(
              "RISKMINER_TARGET_POOL_SIZE=12",
              "RISKMINER_TARGET_POOL_SIZE=6",
          )
          docs.write_text(docs_text)
          PY
      - name: Validate syntax and focused RiskMiner tests
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: |
          python -m py_compile scripts/run_riskminer_inputdata.py
          python -m pytest -q -o addopts="" \
            tests/flows/riskminer/test_core.py \
            tests/flows/riskminer/test_inputdata_semantics.py \
            tests/flows/riskminer/test_native.py
      - name: Commit validated runner correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_riskminer_inputdata.py docs/riskminer_inputdata.md
          if git diff --cached --quiet; then
            echo "Runner already aligned"
            exit 0
          fi
          git commit -m "Align RiskMiner InputData runner with riskmodel"
          git push origin HEAD:agent/riskminer-cpp-stream-v1

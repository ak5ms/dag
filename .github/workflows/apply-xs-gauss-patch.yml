name: apply xs_gauss native patch

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/xs_gauss_spacing.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply staged native patch
        if: ${{ hashFiles('scripts/xs_gauss_spacing.patch') != '' }}
        run: |
          git apply --check scripts/xs_gauss_spacing.patch
          git apply scripts/xs_gauss_spacing.patch
          rm scripts/xs_gauss_spacing.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "cpp_stream: redefine xs_gauss spacing and location"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

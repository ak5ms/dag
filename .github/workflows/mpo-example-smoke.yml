name: MPO example smoke

on:
  push:
    branches: [agent/mpo-inputdata-example]
  pull_request:
    branches: [main]
    paths:
      - "examples/cpp_stream_mpo_one_pass.py"
      - "tests/examples/test_cpp_stream_mpo_one_pass.py"
      - ".github/workflows/mpo-example-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[optimizer]'
      - name: Run MPO fake-data smoke test
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
        run: python -m pytest -q -o addopts="" tests/examples/test_cpp_stream_mpo_one_pass.py

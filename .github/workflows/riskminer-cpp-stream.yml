name: RiskMiner cpp_stream checkpoint

on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - "src/flows/riskminer/**"
      - "scripts/benchmark_riskminer_cpp_stream.py"
      - "tests/flows/riskminer/**"
      - ".github/workflows/riskminer-cpp-stream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run typed RPN, MCTS, native scorer, and native pool tests
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/flows/riskminer
          tests/flows/test_alpha_search.py
      - name: Run reduced native RiskMiner benchmark
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
          RISKMINER_ROWS: "4000"
          RISKMINER_INSTRUMENTS: "9"
          RISKMINER_SIMULATIONS: "8"
          RISKMINER_ROLLOUTS: "2"
          RISKMINER_EVALUATION_BATCH: "4"
          RISKMINER_ARCHIVE_SIZE: "20"
          RISKMINER_POOL_SIZE: "3"
          RISKMINER_OUTPUT_DIR: "/tmp/riskminer-output"
        run: python scripts/benchmark_riskminer_cpp_stream.py
      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riskminer-cpp-stream-smoke
          path: /tmp/riskminer-output/riskminer_benchmark.json
          if-no-files-found: warn

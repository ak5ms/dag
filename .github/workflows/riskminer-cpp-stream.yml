name: RiskMiner cpp_stream checkpoint

on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - "src/flows/riskminer/**"
      - "scripts/benchmark_riskminer_cpp_stream.py"
      - "scripts/benchmark_riskminer_deep_cpp_stream.py"
      - "scripts/benchmark_riskminer_deep_quality_cpp_stream.py"
      - "scripts/run_riskminer_inputdata.py"
      - "tests/flows/riskminer/**"
      - "docs/riskminer_inputdata.md"
      - ".github/workflows/riskminer-cpp-stream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests-and-deep-search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run typed RPN, InputData semantics, MCTS, native scorer, and native pool tests
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/flows/riskminer/test_core.py
          tests/flows/riskminer/test_inputdata_semantics.py
          tests/flows/riskminer/test_native.py
      - name: Run quality-filtered higher-depth native RiskMiner benchmark
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
          RISKMINER_ROWS: "5000"
          RISKMINER_INSTRUMENTS: "9"
          RISKMINER_SIMULATIONS: "48"
          RISKMINER_ROLLOUTS: "4"
          RISKMINER_EVALUATION_BATCH: "8"
          RISKMINER_ARCHIVE_SIZE: "100"
          RISKMINER_MAX_DEPTH: "8"
          RISKMINER_MIN_FORMULA_DEPTH: "5"
          RISKMINER_MAX_TOKENS: "28"
          RISKMINER_OUTPUT_DIR: "/tmp/riskminer-deep-output"
        run: |
          set -o pipefail
          mkdir -p /tmp/riskminer-deep-output
          python scripts/benchmark_riskminer_deep_quality_cpp_stream.py \
            2>&1 | tee /tmp/riskminer-deep-output/benchmark.log
      - name: Upload higher-depth output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riskminer-cpp-stream-deep-quality-search
          path: /tmp/riskminer-deep-output/
          if-no-files-found: warn

name: RiskMiner env documentation validation
on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - .github/workflows/riskminer-env-docs.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/riskminer-cpp-stream-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply inline documentation
        run: python scripts/.riskminer_env_docs_patch.py
      - name: Syntax and documentation checks
        run: |
          python -m py_compile scripts/run_riskminer_inputdata.py
          python - <<'PY'
          from pathlib import Path
          s = Path('scripts/run_riskminer_inputdata.py').read_text()
          required = [
              'RISKMINER_INPUT_GLOB', 'RISKMINER_ROWS', 'RISKMINER_MAX_DEPTH',
              'RISKMINER_MAX_TOKENS', 'RISKMINER_ITERATIONS_PER_DEPTH',
              'RISKMINER_SIMULATIONS', 'RISKMINER_ROLLOUTS',
              'RISKMINER_EVALUATION_BATCH', 'RISKMINER_ARCHIVE_SIZE',
              'RISKMINER_POOL_CAPACITY', 'RISKMINER_POOL_MIN_IMPROVEMENT',
              'RISKMINER_RIDGE_RECOMPUTE_EVERY', 'RISKMINER_TRAIN_FRACTION',
              'RISKMINER_VALIDATION_FRACTION', 'RISKMINER_POLICY_EPOCHS',
              'RISKMINER_POLICY_BATCH_SIZE', 'RISKMINER_POLICY_LEARNING_RATE',
              'RISKMINER_QUANTILE_CDF', 'RISKMINER_QUANTILE_LEARNING_RATE',
              'RISKMINER_EXPLORATION', 'RISKMINER_ROLLOUT_END_PROBABILITY',
              'RISKMINER_REPLAY_CAPACITY', 'RISKMINER_POOL_IMPORTANCE',
              'RISKMINER_THREADS', 'RISKMINER_SEED',
              'RISKMINER_HEARTBEAT_SECONDS', 'RISKMINER_OUTPUT_DIR',
              'RISKMINER_REUSE_DERIVED', 'RISKMINER_RESUME_POLICY',
              'RISKMINER_LOG_LEVEL',
          ]
          assert all(name in s for name in required)
          assert 'The PAPER\'s rule is simply' in s
          assert 'current reuse check does NOT fingerprint' in s
          print({'documented_env_vars': len(required)})
          PY
      - name: Commit implementation
        run: |
          git config user.name openai-agent
          git config user.email openai-agent@users.noreply.github.com
          git add scripts/run_riskminer_inputdata.py
          git commit -m 'Document RiskMiner environment variables inline'
          git push origin HEAD:agent/riskminer-cpp-stream-v1

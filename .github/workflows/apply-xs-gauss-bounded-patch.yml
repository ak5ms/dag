name: apply bounded xs_gauss patch

on:
  pull_request:
    branches: [agent/strongly-typed-gp]
    paths:
      - "scripts/xs_gauss_bounded_location.patch"
      - ".github/workflows/apply-xs-gauss-bounded-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply staged native patch
        run: |
          git apply --check scripts/xs_gauss_bounded_location.patch
          git apply scripts/xs_gauss_bounded_location.patch
          rm scripts/xs_gauss_bounded_location.patch
          rm .github/workflows/apply-xs-gauss-bounded-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound xs_gauss location by RMS"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

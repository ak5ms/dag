name: Finalize tensor GP branch

on:
  push:
    branches:
      - agent/strongly-typed-gp-tensor-work
    paths:
      - "src/flows/gp/**"
      - "tests/flows/gp/**"
      - ".github/workflows/gp-compile-fuzz.yml"
      - ".github/workflows/gp-tensor-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-tensor-gp
  cancel-in-progress: true

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      TRADING_DSL_ENGINE_CPP_LTO: "0"
      TRADING_DSL_ENGINE_CPP_NATIVE: "0"
      GP_IR_FUZZ_SAMPLES: "2000"
      GP_NATIVE_FUZZ_SAMPLES: "40"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run complete focused GP suite
        run: python -m pytest -q -o addopts="" tests/flows/gp
      - name: Run deeper generated formulas
        env:
          GP_FUZZ_MIN_DEPTH: "4"
          GP_FUZZ_MAX_DEPTH: "8"
          GP_IR_FUZZ_SAMPLES: "1000"
          GP_NATIVE_FUZZ_SAMPLES: "3"
        run: >-
          python -m pytest -q -s -o addopts=""
          tests/flows/gp/test_compile_fuzz.py::test_random_gp_formulas_compile_to_cpp_stream_ir
          tests/flows/gp/test_compile_fuzz.py::test_random_gp_formulas_compile_natively
      - name: Generate exact signature inventory
        run: python -m flows.gp.signatures | tee /tmp/gp-signatures.txt
      - name: Create one-commit stable branch from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/strongly-typed-gp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree HEAD
          git rm --cached --ignore-unmatch .github/workflows/gp-tensor-finalize.yml
          tree=$(git write-tree)
          parent=$(git rev-parse origin/main)
          commit=$(printf '%s\n' 'Add validated strongly typed tensor GP flow' | git commit-tree "$tree" -p "$parent")
          git push --force origin "$commit:refs/heads/agent/strongly-typed-gp"
          echo "stable_commit=$commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact signature inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-final-signatures
          path: /tmp/gp-signatures.txt
          if-no-files-found: warn

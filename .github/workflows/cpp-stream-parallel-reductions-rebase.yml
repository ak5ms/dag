name: cpp_stream parallel reductions validation

on:
  pull_request:
    branches: [cpp-stream-backend]
    paths:
      - ".github/workflows/cpp-stream-parallel-reductions-rebase.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpp-stream-parallel-reductions-rebase
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use latest backend API fix
        run: |
          git fetch origin cpp-stream-backend
          git checkout origin/cpp-stream-backend -- src/trading_dsl_engine/base/dsl.py
      - name: Verify CPU allocation
        run: |
          lscpu
          python - <<'PY'
          import os
          cpus = sorted(os.sched_getaffinity(0))
          print("affinity_cpus=", cpus)
          if len(cpus) < 4:
              raise SystemExit("parallel validation requires four available CPUs")
          PY
      - name: Install dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy numba pytest jinja2 jax equinox astropy
          includeigen pybind11 matplotlib graphviz scipy
      - name: Run backend and parallel reduction correctness
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: >-
          python -m pytest -q -o addopts=""
          tests/trading_dsl_engine/cpp_stream/test_reductions.py
          tests/trading_dsl_engine/cpp_stream/test_reductions_parallel.py
          tests/trading_dsl_engine/cpp_stream/test_parallel.py
          tests/trading_dsl_engine/cpp_stream/test_parallel_auto.py
          tests/trading_dsl_engine/cpp_stream/test_parallel_row_scalar.py
          tests/trading_dsl_engine/cpp_stream/test_where_broadcast.py
          tests/trading_dsl_engine/cpp_stream/test_cat_parallel.py
          tests/trading_dsl_engine/cpp_stream/test_roll_rets.py
          tests/trading_dsl_engine/cpp_stream/test_minute_groupby.py
      - name: Benchmark streaming reductions
        env:
          PYTHONPATH: src
          CPP_STREAM_REDUCTION_ROWS: "1000000"
          CPP_STREAM_REDUCTION_INSTRUMENTS: "9"
          CPP_STREAM_REDUCTION_RUNS: "7"
          CPP_STREAM_REDUCTION_WARMUPS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_reductions.py
      - name: Benchmark Cat multicore
        env:
          PYTHONPATH: src
          CPP_STREAM_CAT_ROWS: "5000000"
          CPP_STREAM_CAT_INSTRUMENTS: "9"
          CPP_STREAM_CAT_RUNS: "10"
          CPP_STREAM_CAT_WARMUPS: "1"
          CPP_STREAM_REQUIRE_MULTICORE: "1"
          CPP_STREAM_PIN_THREADS: "1"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_cat_parallel.py
      - name: Run broad parallel matrix
        env:
          PYTHONPATH: src
          CPP_STREAM_PARALLEL_ROWS: "1000000"
          CPP_STREAM_PARALLEL_ROLL_ROWS: "1000000"
          CPP_STREAM_PARALLEL_INSTRUMENTS: "64"
          CPP_STREAM_PARALLEL_RUNS: "5"
          CPP_STREAM_PARALLEL_WARMUPS: "1"
          CPP_STREAM_PARALLEL_THREADS: "1,2,4"
          CPP_STREAM_BENCH_OUTPUT_DIR: /dev/shm
        run: python scripts/benchmark_cpp_stream_parallel_matrix.py

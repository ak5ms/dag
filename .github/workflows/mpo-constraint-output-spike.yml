name: MPO constraint-output spike

on:
  push:
    branches: [agent/mpo-constraint-output-spike]
    paths:
      - .github/workflows/mpo-constraint-output-spike.yml
      - scripts/spike_mpo_constraint_output.py

concurrency:
  group: mpo-constraint-output-spike
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e '.[optimizer]' graphviz
      - name: Benchmark equal-payload constraint outputs
        env:
          PYTHONPATH: src:.
          MPLBACKEND: Agg
          MPO_FINAL_ROWS: "5000"
          MPO_CONSTRAINT_RUNS: "10"
          RUSTFLAGS: -C target-cpu=native
        run: python scripts/spike_mpo_constraint_output.py

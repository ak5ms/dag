name: mpo

on:
  push:
    branches: [mpo, mpo-cvxpygen-bench]
    paths:
      - "src/flows/mpo.py"
      - "src/flows/riskmodel.py"
      - "tests/flows/test_mpo.py"
      - "scripts/benchmark_mpo.py"
      - "scripts/generate_mpo_cvxpygen.py"
      - "pyproject.toml"
      - ".github/workflows/mpo.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/flows/mpo.py"
      - "src/flows/riskmodel.py"
      - "tests/flows/test_mpo.py"
      - "scripts/benchmark_mpo.py"
      - "scripts/generate_mpo_cvxpygen.py"
      - "pyproject.toml"
      - ".github/workflows/mpo.yml"
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and solver dependencies
        run: >-
          python -m pip install
          numpy pandas numba scipy jax equinox pytest pytest-xdist
          pybind11 includeigen Jinja2 unxt deap pydot graphviz matplotlib
          moreau==0.3.3
      - name: Package source and portable dependency wheels
        run: |
          mkdir -p mpo-local-bundle/wheels
          tar --exclude=.git -czf mpo-local-bundle/dag-mpo-source.tar.gz \
            pyproject.toml setup.py src scripts/benchmark_mpo.py tests/flows/test_mpo.py
          python -m pip download --no-deps --dest mpo-local-bundle/wheels \
            moreau==0.3.3 moreau-cpu==0.3.3 \
            equinox==0.13.8 jaxtyping==0.3.11 wadler-lindig==0.1.7 \
            pybind11==3.1.0 includeigen==0.1 \
            astropy==8.0.1 pyerfa==2.0.1.5 astropy-iers-data \
            graphviz==0.21
      - name: Upload local benchmark bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpo-local-bundle
          path: mpo-local-bundle
          if-no-files-found: error
          retention-days: 1
      - name: Test MPO and risk-model integration
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: python -m pytest -q -o addopts="" tests/flows/test_mpo.py
      - name: Run synthetic risk-model/MPO benchmark
        env:
          PYTHONPATH: src
          JAX_ENABLE_X64: "1"
        run: python scripts/benchmark_mpo.py

  cvxpygen-clarabel-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native code-generation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev
          rustup show active-toolchain
          cargo --version
          cmake --version
      - name: Install CVXPYgen and Clarabel
        run: >-
          python -m pip install
          cvxpy==1.9.2 cvxpygen==1.0.0 clarabel==0.11.1
      - name: Generate and smoke-test native Clarabel MPO solver
        run: >-
          python scripts/generate_mpo_cvxpygen.py
          --output-dir mpo-cvxpygen-generated
          --sizes 24x8
      - name: Package generated solver and Python wheels
        run: |
          mkdir -p mpo-cvxpygen-bundle/wheels
          cp -R mpo-cvxpygen-generated mpo-cvxpygen-bundle/
          cp scripts/generate_mpo_cvxpygen.py mpo-cvxpygen-bundle/
          python -m pip freeze > mpo-cvxpygen-bundle/requirements-freeze.txt
          python -m pip download --dest mpo-cvxpygen-bundle/wheels \
            cvxpy==1.9.2 cvxpygen==1.0.0 clarabel==0.11.1
      - name: Upload CVXPYgen Clarabel bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpo-cvxpygen-clarabel
          path: mpo-cvxpygen-bundle
          if-no-files-found: error
          retention-days: 1

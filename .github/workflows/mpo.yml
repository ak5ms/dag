name: mpo

on:
  push:
    branches: [mpo]
    paths:
      - ".github/workflows/mpo.yml"
  workflow_dispatch:

jobs:
  package-python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package portable CPython runtime
        run: |
          mkdir -p mpo-python311-runtime
          tar -C "$(dirname "$pythonLocation")" -czf mpo-python311-runtime/python311.tar.gz "$(basename "$pythonLocation")"
      - name: Upload portable CPython runtime
        uses: actions/upload-artifact@v4
        with:
          name: mpo-python311-runtime
          path: mpo-python311-runtime
          if-no-files-found: error
          retention-days: 1

name: RiskMiner source snapshot

on:
  push:
    branches:
      - agent/riskminer-cpp-stream-v1
    paths:
      - ".github/workflows/riskminer-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source snapshot
        run: tar --exclude=.git -czf /tmp/dag-riskminer-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dag-riskminer-source
          path: /tmp/dag-riskminer-source.tar.gz
          if-no-files-found: error

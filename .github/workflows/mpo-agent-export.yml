name: mpo-agent-export

on:
  push:
    branches: [mpo-agent-export]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mpo-agent-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch and create git bundle
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create /tmp/dag.bundle --all
          git bundle verify /tmp/dag.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: dag-git-bundle
          path: /tmp/dag.bundle
          if-no-files-found: error
          retention-days: 1

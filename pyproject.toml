[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12", "includeigen"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_dsl_engine"
version = "0.1.0"
description = "Numba-compiled streaming DSL engine for trading features"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "jax[cpu]~=0.6.1",
    "equinox>=0.13.2",
    "pytest",
    "pytest-xdist",
    "pybind11>=2.12",
    "includeigen",
    "unxt>=1.11",
    "immrax>=0.3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --durations=0 -n 12 --import-mode=importlib"

markers = ["perf: performance tests"]

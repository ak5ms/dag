[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12", "includeigen", "jax[cpu]"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_dsl_engine"
version = "0.1.0"
description = "Numba-compiled streaming DSL engine for trading features"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "numba",
    "scipy",
    "jax[cpu]",
    "equinox",
    "pytest",
    "pytest-xdist",
    "pybind11>=2.12",
    "includeigen",
    "Jinja2>=3.1",
    "unxt>=1.11",
    "deap",
    "pydot",
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --durations=0 -n 12 --import-mode=importlib"

markers = ["perf: performance tests"]

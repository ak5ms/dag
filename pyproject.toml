[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_dsl_engine"
version = "0.1.0"
description = "Numba-compiled streaming DSL engine for trading features"
requires-python = ">=3.10"
dependencies = ["numpy", "numba", "scipy"]

[project.optional-dependencies]
jax = ["jax[cpu]", "equinox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --durations=0"

markers = ["perf: performance tests"]
